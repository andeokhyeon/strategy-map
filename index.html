<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>전략 지도 – 종합 보드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#0c0c0c;
      color:#f5f5f5;
    }
    .app {
      display:flex;
      flex-direction:column;
      height:100vh;
      max-width:1200px;
      margin:0 auto;
      background:#111;
    }

    /* ===== 상단: 지도 + 우측 패널 ===== */
    .top-row {
      flex:1;
      display:flex;
      min-height:0;
      border-bottom:1px solid #222;
    }
    #map-wrapper {
      flex:2;
      display:flex;
      flex-direction:column;
      min-width:0;
    }
    #map-container {
      position:relative;
      flex:1;
      background:#000;
      overflow:auto;
    }
    #map-image {
      display:block;
      max-width:none;
      width:100%;
      height:auto;
    }
    #map-overlay {
      position:absolute;
      left:0;
      top:0;
      pointer-events:none;
    }

    .toolbar {
      display:flex;
      align-items:center;
      gap:10px;
      padding:8px 10px;
      font-size:13px;
      background:#181818;
      border-top:1px solid #333;
    }
    #mode-indicator {
      font-size:12px;
      color:#ccc;
    }
    #color-palette {
      display:flex;
      align-items:center;
      gap:6px;
      flex-wrap:wrap;
    }
    .color-dot {
      width:18px;
      height:18px;
      border-radius:50%;
      border:2px solid #444;
      cursor:pointer;
    }
    .color-dot.active {
      border-color:#fff;
      box-shadow:0 0 4px rgba(255,255,255,0.8);
    }
    #hint-text {
      margin-left:auto;
      font-size:12px;
      color:#888;
    }

    .node {
      cursor:pointer;
    }
    .node-circle {
      stroke:#000;
      stroke-width:1;
    }
    .node-label {
      font-size:10px;
      fill:#fff;
      text-anchor:middle;
      dominant-baseline:hanging;
      paint-order:stroke;
      stroke:#000;
      stroke-width:0.7;
    }

    .link {
      cursor:pointer;
      stroke-linecap:round;
      filter:drop-shadow(0 0 2px rgba(0,0,0,0.7));
    }
    @keyframes arrowBlink {
      0%,100% {opacity:1;}
      50%     {opacity:0.4;}
    }
    .link-blink {
      animation:arrowBlink 1s infinite;
    }

    /* ===== 우측 패널 (닉네임 / 접속자 / 팀) ===== */
    #side-panel {
      flex:1;
      min-width:240px;
      max-width:360px;
      border-left:1px solid #222;
      background:#141414;
      display:flex;
      flex-direction:column;
      padding:8px;
      gap:8px;
      font-size:12px;
    }
    .panel-box {
      background:#1b1b1b;
      border-radius:10px;
      padding:8px;
      border:1px solid #2a2a2a;
    }
    .panel-title {
      font-weight:600;
      margin-bottom:4px;
      font-size:12px;
    }

    /* 닉네임 / 접속자 */
    #profile-panel-main {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:6px;
      margin-bottom:4px;
    }
    #nickname-current {
      font-weight:600;
      color:#ffd54f;
    }
    .small-btn {
      border:none;
      border-radius:999px;
      padding:3px 8px;
      font-size:11px;
      background:#2f2f2f;
      color:#eee;
      cursor:pointer;
      white-space:nowrap;
    }
    .small-btn:hover {
      background:#3a3a3a;
    }
    #online-count {
      font-size:11px;
      color:#aaa;
      margin-bottom:4px;
    }
    #online-list {
      list-style:none;
      padding:0;
      margin:0;
      max-height:80px;
      overflow-y:auto;
      font-size:11px;
    }
    #online-list li {
      padding:1px 0;
    }

    /* 팀 관리 */
    #army-link-btn {
      width:100%;
      margin:4px 0 6px;
      border:none;
      border-radius:8px;
      padding:5px 0;
      font-size:11px;
      background:#3949ab;
      color:#fff;
      cursor:pointer;
    }
    #army-link-btn:hover {
      opacity:0.9;
    }
    #teams-grid {
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:6px;
    }
    .team-card {
      background:#202020;
      border-radius:8px;
      padding:6px;
      border:1px solid #333;
      display:flex;
      flex-direction:column;
      gap:4px;
    }
    .team-name-input {
      width:100%;
      border-radius:6px;
      border:1px solid #333;
      padding:3px 5px;
      font-size:11px;
      background:#181818;
      color:#f5f5f5;
    }
    .team-members {
      list-style:none;
      padding:0;
      margin:0;
      max-height:70px;
      overflow-y:auto;
      font-size:11px;
    }
    .team-members li {
      padding:1px 0;
    }
    .team-buttons {
      display:flex;
      flex-wrap:wrap;
      gap:3px;
      margin-top:2px;
    }

    /* ===== 하단: 채팅 ===== */
    #chat-wrapper {
      height:32vh;
      min-height:180px;
      display:flex;
      flex-direction:column;
      background:#101010;
    }
    #chat-header {
      display:flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      font-size:12px;
      background:#181818;
      border-top:1px solid #222;
      border-bottom:1px solid #222;
    }
    #chat-nick-label {
      font-size:12px;
      color:#ccc;
    }
    #chat-messages {
      flex:1;
      overflow-y:auto;
      padding:8px 10px;
      font-size:13px;
    }
    .chat-msg {
      margin-bottom:4px;
      word-wrap:break-word;
    }
    .chat-nick {
      font-weight:600;
      margin-right:4px;
      color:#ffcc66;
    }
    .chat-time {
      font-size:10px;
      color:#777;
      margin-left:4px;
    }
    #chat-form {
      display:flex;
      padding:6px 8px;
      gap:6px;
      border-top:1px solid #222;
    }
    #chat-input {
      flex:1;
      border-radius:999px;
      border:1px solid #333;
      padding:8px 12px;
      font-size:13px;
      background:#181818;
      color:#f5f5f5;
      outline:none;
    }
    #chat-input::placeholder {
      color:#666;
    }
    #chat-send-btn {
      border-radius:999px;
      border:none;
      padding:0 14px;
      font-size:13px;
      background:#3f8cff;
      color:#fff;
      cursor:pointer;
      white-space:nowrap;
    }
    #chat-send-btn:active {
      opacity:0.85;
    }

    @media (max-width:900px){
      .top-row{
        flex-direction:column;
      }
      #side-panel{
        max-width:none;
        border-left:none;
        border-top:1px solid #222;
        flex:none;
      }
      #map-wrapper{
        min-height:40vh;
      }
    }
    @media (max-width:600px){
      .toolbar{flex-wrap:wrap;}
      #hint-text{
        flex-basis:100%;
        margin-left:0;
        margin-top:4px;
      }
    }

    /* ===== 노드 클릭 메뉴 ===== */
    #node-menu {
      position:fixed;
      z-index:50;
      background:#202020;
      border:1px solid #444;
      border-radius:10px;
      padding:6px;
      display:none;
      min-width:160px;
      box-shadow:0 8px 16px rgba(0,0,0,0.7);
      font-size:12px;
    }
    #node-menu-title {
      font-weight:600;
      margin-bottom:4px;
      font-size:12px;
    }
    .node-menu-btn {
      width:100%;
      border:none;
      border-radius:6px;
      background:#2a2a2a;
      color:#f5f5f5;
      padding:5px 6px;
      margin-top:4px;
      cursor:pointer;
      text-align:left;
    }
    .node-menu-btn:hover {
      background:#3a3a3a;
    }

    /* 색 선택 팝업 */
    #color-picker {
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.45);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:60;
    }
    #color-picker-panel {
      background:#222;
      border-radius:12px;
      border:1px solid #555;
      padding:10px 12px;
      min-width:200px;
      box-shadow:0 10px 24px rgba(0,0,0,0.8);
      font-size:13px;
    }
    #color-picker-title {
      margin-bottom:6px;
    }
    #color-picker-colors {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-bottom:8px;
    }
    .cp-color {
      width:24px;
      height:24px;
      border-radius:50%;
      border:2px solid #444;
      cursor:pointer;
    }
    .cp-color.active {
      border-color:#fff;
      box-shadow:0 0 5px rgba(255,255,255,0.9);
    }
    #color-picker-cancel {
      width:100%;
      border:none;
      border-radius:6px;
      background:#333;
      color:#eee;
      padding:5px 0;
      font-size:12px;
      cursor:pointer;
    }
    #color-picker-cancel:hover {
      background:#444;
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ===== 상단: 지도 + 우측 패널 ===== -->

    localStorage.setItem("nickname", nickname);
    updateNicknameUI();
    // 접속자 정보 업데이트
    if (myPresenceId) {
      presenceRef.child(myPresenceId).update({ nick: nickname });
    }
  }

  btnChangeNick.addEventListener("click", changeNickname);
  btnChangeNickChat.addEventListener("click", changeNickname);

  // ===== Firebase 참조들 =====
  const nodesRef   = db.ref("mapNodes");
  const linksRef   = db.ref("mapLinks");
  const chatRef    = db.ref("chatMessages");
  const presenceRef= db.ref("presence");
  const teamsRef   = db.ref("teams");

  // ===== 접속자 표시 (presence) =====
  const onlineCountEl = document.getElementById("online-count");
  const onlineListEl  = document.getElementById("online-list");

  let myPresenceId = null;
  const connectedRef = db.ref(".info/connected");
  connectedRef.on("value", snap => {
    if (snap.val() === true) {
      const newRef = presenceRef.push();
      myPresenceId = newRef.key;
      newRef.onDisconnect().remove();
      newRef.set({
        nick: nickname,
        ts: firebase.database.ServerValue.TIMESTAMP
      });
    }
  });

  presenceRef.on("value", snap => {
    const data = snap.val() || {};
    const users = Object.values(data);
    onlineCountEl.textContent = "온라인 " + users.length + "명";
    onlineListEl.innerHTML = "";
    users.forEach(u => {
      const li = document.createElement("li");
      li.textContent = u.nick || "손님";
      onlineListEl.appendChild(li);
    });
  });

  // ===== 팀 관리 =====
  const teamKeys = ["team1","team2","team3","team4","team5","team6"];

  function renderTeams(teamsData) {
    teamsData = teamsData || {};
    teamKeys.forEach(key => {
      const nameInput = document.getElementById(key + "-name");
      const membersUl = document.getElementById(key + "-members");
      const info = teamsData[key] || {};
      const teamName = info.name || ("팀" + key.replace("team",""));
      nameInput.value = teamName;

      membersUl.innerHTML = "";
      const members = info.members || {};
      Object.values(members).forEach(m => {
        const li = document.createElement("li");
        li.textContent = m.name || "";
        membersUl.appendChild(li);
      });
    });
  }

  teamsRef.on("value", snap => {
    const val = snap.val() || {};
    renderTeams(val);
  });

  // 팀 이름 수정
  teamKeys.forEach(key => {
    const nameInput = document.getElementById(key + "-name");
    nameInput.addEventListener("change", () => {
      const v = nameInput.value.trim() || ("팀" + key.replace("team",""));
      teamsRef.child(key).update({ name: v });
    });
  });

  // 팀 버튼들
  function getTeamPath(teamKey) {
    return teamsRef.child(teamKey);
  }

  document.querySelectorAll(".btn-join-team").forEach(btn => {
    btn.addEventListener("click", () => {
      const teamKey = btn.dataset.team;
      const mRef = getTeamPath(teamKey).child("members").push();
      mRef.set({ name: nickname });
    });
  });

  document.querySelectorAll(".btn-add-manual").forEach(btn => {
    btn.addEventListener("click", () => {
      const teamKey = btn.dataset.team;
      const name = (window.prompt("추가할 팀원 이름을 입력하세요:") || "").trim();
      if (!name) return;
      const mRef = getTeamPath(teamKey).child("members").push();
      mRef.set({ name });
    });
  });

  document.querySelectorAll(".btn-clear-team").forEach(btn => {
    btn.addEventListener("click", () => {
      const teamKey = btn.dataset.team;
      if (!window.confirm("이 팀의 모든 팀원을 삭제할까요?")) return;
      getTeamPath(teamKey).child("members").remove();
    });
  });

  // 풍운 병력확인 링크
  document.getElementById("army-link-btn").addEventListener("click", () => {
    window.open(
      "https://script.google.com/macros/s/AKfycbzphmhTURMTavq1VI3U4nNv-znUn4wQRnGPYHm_ijoxXVlJBupMThpy8soW0LpWcHZd-g/exec",
      "_blank"
    );
  });

  // ===== 채팅 =====
  const chatMessagesEl = document.getElementById("chat-messages");
  const chatForm       = document.getElementById("chat-form");
  const chatInput      = document.getElementById("chat-input");
  const btnClearChat   = document.getElementById("btn-clear-chat");

  function formatTime(ts) {
    const d = new Date(ts);
    const hh = String(d.getHours()).padStart(2,"0");
    const mm = String(d.getMinutes()).padStart(2,"0");
    return hh + ":" + mm;
  }

  function addChatMessage(data) {
    const div = document.createElement("div");
    div.className = "chat-msg";

    const nickSpan = document.createElement("span");
    nickSpan.className = "chat-nick";
    nickSpan.textContent = data.nick;

    const textSpan = document.createElement("span");
    textSpan.textContent = data.text;

    const timeSpan = document.createElement("span");
    timeSpan.className = "chat-time";
    timeSpan.textContent = formatTime(data.time || Date.now());

    div.appendChild(nickSpan);
    div.appendChild(textSpan);
    div.appendChild(timeSpan);

    chatMessagesEl.appendChild(div);
    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
  }

  chatRef.on("child_added", snap => {
    const v = snap.val();
    if (!v) return;
    addChatMessage(v);
  });

  chatForm.addEventListener("submit", e => {
    e.preventDefault();
    const text = chatInput.value.trim();
    if (!text) return;
    chatRef.push({
      nick: nickname,
      text,
      time: Date.now()
    });
    chatInput.value = "";
  });

  btnClearChat.addEventListener("click", () => {
    const pw = window.prompt("채팅을 모두 삭제하려면 비밀번호(1234)를 입력하세요:");
    if (pw !== "1234") {
      alert("비밀번호가 틀렸습니다.");
      return;
    }
    if (!window.confirm("채팅을 정말 모두 삭제할까요?")) return;
    chatRef.remove();
    chatMessagesEl.innerHTML = "";
  });

  // ===== 지도 / 거점 / 화살표 =====
  const mapContainer   = document.getElementById("map-container");
  const mapImage       = document.getElementById("map-image");
  const overlay        = document.getElementById("map-overlay");
  const hintText       = document.getElementById("hint-text");
  const colorDots      = document.querySelectorAll(".color-dot");

  const nodeMenu       = document.getElementById("node-menu");
  const nodeMenuTitle  = document.getElementById("node-menu-title");
  const btnNodeColor   = document.getElementById("btn-node-color");
  const btnNodeArrow   = document.getElementById("btn-node-arrow");
  const btnNodeDelArrows = document.getElementById("btn-node-del-arrows");

  const colorPicker        = document.getElementById("color-picker");
  const cpColors           = document.querySelectorAll(".cp-color");
  const colorPickerCancel  = document.getElementById("color-picker-cancel");

  let nodes = {};
  let links = {};
  let currentColor = "#e53935";
  let arrowStartNodeId = null;
  let menuNodeId = null;
  let colorPickerCallback = null;

  function setPaletteColor(color) {
    currentColor = color;
    colorDots.forEach(dot =>
      dot.classList.toggle("active", dot.dataset.color === color)
    );
  }
  colorDots.forEach(dot => {
    dot.addEventListener("click", () => setPaletteColor(dot.dataset.color));
  });
  setPaletteColor(currentColor);

  // 색 선택 팝업
  function openColorPicker(defaultColor, cb) {
    colorPickerCallback = cb;
    colorPicker.style.display = "flex";
    cpColors.forEach(c => {
      c.classList.toggle("active", c.dataset.color === defaultColor);
    });
  }
  function closeColorPicker() {
    colorPicker.style.display = "none";
    colorPickerCallback = null;
  }
  cpColors.forEach(el => {
    el.addEventListener("click", () => {
      if (!colorPickerCallback) return;
      const chosen = el.dataset.color;
      const cb = colorPickerCallback;
      closeColorPicker();
      cb(chosen);
    });
  });
  colorPickerCancel.addEventListener("click", () => {
    if (colorPickerCallback) {
      const cb = colorPickerCallback;
      closeColorPicker();
      cb(null);
    } else {
      closeColorPicker();
    }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && colorPicker.style.display === "flex") {
      closeColorPicker();
    }
  });

  // 오버레이 크기 맞추기
  function resizeOverlay() {
    const rect = mapImage.getBoundingClientRect();
    overlay.setAttribute("width", rect.width);
    overlay.setAttribute("height", rect.height);
    overlay.style.width  = rect.width + "px";
    overlay.style.height = rect.height + "px";
    overlay.style.pointerEvents = "none";
    drawAll();
  }
  if (mapImage.complete) resizeOverlay();
  else mapImage.onload = resizeOverlay;
  window.addEventListener("resize", resizeOverlay);

  // DB 동기화
  nodesRef.on("value", snap => {
    nodes = snap.val() || {};
    drawAll();
  });
  linksRef.on("value", snap => {
    links = snap.val() || {};
    drawAll();
  });

  // 좌표 변환
  function getRelativePos(clientX, clientY) {
    const rect = mapImage.getBoundingClientRect();
    const x = (clientX - rect.left) / rect.width;
    const y = (clientY - rect.top ) / rect.height;
    return { x, y };
  }
  function toScreenPos(node) {
    const rect = mapImage.getBoundingClientRect();
    return { x: node.x * rect.width, y: node.y * rect.height };
  }

  // 지도 빈 곳 클릭 → 새 거점
  mapContainer.addEventListener("click", e => {
    if (e.target.closest("svg")) return;

    closeNodeMenu();

    if (arrowStartNodeId) {
      arrowStartNodeId = null;
      hintText.textContent = "화살표 시작이 취소되었습니다. 출발 거점을 다시 선택하세요.";
      return;
    }

    const pos = getRelativePos(e.clientX, e.clientY);
    openColorPicker(currentColor, chosenColor => {
      if (!chosenColor) return;
      const name = (window.prompt("새 거점 이름을 입력하세요:") || "").trim();
      if (!name) return;
      const newRef = nodesRef.push();
      newRef.set({
        x: pos.x,
        y: pos.y,
        name: name,
        color: chosenColor
      });
    });
  });

  // 노드 메뉴
  function openNodeMenu(nodeId, screenX, screenY) {
    menuNodeId = nodeId;
    const node = nodes[nodeId];
    nodeMenuTitle.textContent = "거점: " + (node?.name || nodeId);
    nodeMenu.style.display = "block";

    const menuRect = nodeMenu.getBoundingClientRect();
    let left = screenX;
    let top  = screenY;
    if (left + menuRect.width > window.innerWidth - 8)
      left = window.innerWidth - menuRect.width - 8;
    if (top + menuRect.height > window.innerHeight - 8)
      top = window.innerHeight - menuRect.height - 8;
    nodeMenu.style.left = left + "px";
    nodeMenu.style.top  = top  + "px";
  }
  function closeNodeMenu() {
    nodeMenu.style.display = "none";
    menuNodeId = null;
  }
  document.addEventListener("click", e => {
    if (nodeMenu.style.display === "block" &&
        !e.target.closest("#node-menu") &&
        !e.target.closest("svg")) {
      closeNodeMenu();
    }
  });

  // 메뉴: 거점 색 변경
  btnNodeColor.addEventListener("click", () => {
    if (!menuNodeId) return;
    const node = nodes[menuNodeId];
    openColorPicker(node?.color || currentColor, chosenColor => {
      if (!chosenColor) { closeNodeMenu(); return; }
      const newName = window.prompt(
        "새 거점 이름을 입력하세요 (그대로 두려면 엔터):",
        node?.name || ""
      );
      const updates = { color: chosenColor };
      if (newName && newName.trim()) updates.name = newName.trim();
      nodesRef.child(menuNodeId).update(updates);

      // 이 거점에서 나가는 화살표 머리색도 함께 변경
      Object.entries(links || {}).forEach(([lid, l]) => {
        if (l.from === menuNodeId) {
          linksRef.child(lid).update({ color: chosenColor });
        }
      });

      closeNodeMenu();
    });
  });

  // 메뉴: 이 거점에서 화살표 시작
  btnNodeArrow.addEventListener("click", () => {
    if (!menuNodeId) return;
    arrowStartNodeId = menuNodeId;
    const node = nodes[menuNodeId];
    hintText.textContent =
      "출발 거점: " + (node?.name || menuNodeId) +
      " → 도착 거점을 클릭하세요. (같은 거점 다시 클릭하면 취소)";
    closeNodeMenu();
  });

  // 메뉴: 이 거점 관련 화살표 삭제
  btnNodeDelArrows.addEventListener("click", () => {
    if (!menuNodeId) return;
    if (!window.confirm("이 거점과 연결된 모든 화살표를 삭제할까요?")) return;
    Object.entries(links || {}).forEach(([lid, l]) => {
      if (l.from === menuNodeId || l.to === menuNodeId) {
        linksRef.child(lid).remove();
      }
    });
    closeNodeMenu();
  });

  // 오버레이 지우기
  function clearOverlay() {
    while (overlay.firstChild) overlay.removeChild(overlay.firstChild);
  }

  // 지도/거점/화살표 전체 그리기
  function drawAll() {
    clearOverlay();

    const rect = mapImage.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;

    // 화살표 머리 정의
    const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
    const marker = document.createElementNS("http://www.w3.org/2000/svg", "marker");
    marker.setAttribute("id","arrow-head");
    marker.setAttribute("markerWidth","7");
    marker.setAttribute("markerHeight","7");
    marker.setAttribute("refX","5");
    marker.setAttribute("refY","3.5");
    marker.setAttribute("orient","auto");
    marker.setAttribute("markerUnits","strokeWidth");
    const mp = document.createElementNS("http://www.w3.org/2000/svg", "path");
    mp.setAttribute("d","M0,0 L5,3.5 L0,7 z");
    mp.setAttribute("fill","currentColor");
    marker.appendChild(mp);
    defs.appendChild(marker);
    overlay.appendChild(defs);

    // 화살표: 거점 중심 ↔ 중심, 선은 밝은 회색, 머리색은 출발 거점 색
    Object.entries(links || {}).forEach(([id, link]) => {
      const fromNode = nodes[link.from];
      const toNode   = nodes[link.to];
      if (!fromNode || !toNode) return;

      const p1 = toScreenPos(fromNode);
      const p2 = toScreenPos(toNode);

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`);

      const fromColor = fromNode.color || "#ffffff";
      const headColor = link.color || fromColor;

      path.setAttribute("stroke", "#f0f0f0");
      path.style.color = headColor;
      path.setAttribute("stroke-width","3");
      path.setAttribute("fill","none");
      path.setAttribute("class","link link-blink");
      path.setAttribute("marker-end","url(#arrow-head)");
      path.style.pointerEvents = "auto";

      path.addEventListener("click", e => {
        e.stopPropagation();
        if (!window.confirm("이 화살표를 삭제할까요?")) return;
        linksRef.child(id).remove();
      });

      overlay.appendChild(path);
    });

    // 노드
    Object.entries(nodes || {}).forEach(([id, node]) => {
      const pos = toScreenPos(node);

      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("class","node");
      g.style.pointerEvents = "auto";

      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      circle.setAttribute("cx", pos.x);
      circle.setAttribute("cy", pos.y);
      circle.setAttribute("r", 9);
      circle.setAttribute("fill", node.color || "#ffffff");
      circle.setAttribute("class","node-circle");

      const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
      label.setAttribute("x", pos.x);
      label.setAttribute("y", pos.y + 11);
      label.setAttribute("class","node-label");
      label.textContent = node.name || "";

      g.appendChild(circle);
      g.appendChild(label);

      g.addEventListener("click", e => {
        e.stopPropagation();
        const screenX = e.clientX;
        const screenY = e.clientY;

        // 화살표 출발점 선택 상태에서 다른 노드 클릭 → 화살표 생성
        if (arrowStartNodeId && arrowStartNodeId !== id) {
          const fromNode = nodes[arrowStartNodeId];
          const arrowColor = fromNode?.color || "#ffffff";
          const newRef = linksRef.push();
          newRef.set({
            from: arrowStartNodeId,
            to: id,
            color: arrowColor
          });
          hintText.textContent = "화살표가 생성되었습니다. 또 만들려면 출발 거점을 다시 선택하세요.";
          arrowStartNodeId = null;
          closeNodeMenu();
          return;
        }

        // 같은 노드 다시 클릭 → 취소
        if (arrowStartNodeId && arrowStartNodeId === id) {
          arrowStartNodeId = null;
          hintText.textContent = "화살표 시작이 취소되었습니다. 출발 거점을 다시 선택하세요.";
          closeNodeMenu();
          return;
        }

        // 노드 메뉴 열기
        openNodeMenu(id, screenX + 8, screenY + 8);
      });

      overlay.appendChild(g);
    });
  }
</script>
</body>
</html>
