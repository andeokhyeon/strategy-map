<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>모바일 전략 지도 보드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0c0c0c;
      color: #f5f5f5;
      overflow-x: hidden;
    }
    #map-wrapper, #chat-section, #team-section {
      border: 1px solid #333;
      border-radius: 10px;
      margin: 6px;
      background: #111;
    }
    #map-wrapper { position: relative; width: 100%; height: 55vh; overflow: hidden; }
    #map-container { position: relative; width: 100%; height: 100%; overflow: auto; }
    #map-image { display: block; width: 100%; height: auto; }
    #map-overlay { position: absolute; left: 0; top: 0; pointer-events: none; }

    #zoom-bar { position: absolute; right: 8px; top: 8px; background: rgba(0,0,0,0.6); border-radius: 999px; padding: 3px 6px; display: flex; gap: 4px; font-size: 11px; }
    .zoom-btn { border: none; background: #2f2f2f; color: #eee; border-radius: 999px; width: 22px; height: 22px; cursor: pointer; }

    #chat-section { padding: 8px; background: #101010; }
    #chat-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
    #chat-messages { max-height: 40vh; overflow-y: auto; background: #181818; border-radius: 8px; padding: 8px; margin-bottom: 6px; font-size: 13px; }
    .chat-msg { margin-bottom: 4px; }
    .chat-nick { font-weight: 600; color: #ffcc66; margin-right: 4px; }
    #chat-input { flex: 1; border-radius: 999px; border: 1px solid #333; padding: 8px 10px; background: #181818; color: #fff; }
    #chat-send-btn { border: none; border-radius: 999px; background: #3f8cff; color: #fff; padding: 0 14px; cursor: pointer; }

    #team-section { background: #141414; padding: 8px; margin-bottom: 8px; }
    #taego-link { text-decoration: none; font-size: 11px; border-radius: 999px; padding: 3px 8px; background: #3949ab; color: #fff; }

    #node-menu { position: fixed; z-index: 120; background: rgba(20,20,20,0.95); border-radius: 12px; border: 1px solid #555; padding: 8px; min-width: 160px; box-shadow: 0 10px 24px rgba(0,0,0,0.8); }
    .node-menu-btn { width: 100%; border: none; border-radius: 8px; background: #262626; color: #f5f5f5; padding: 6px 8px; font-size: 12px; cursor: pointer; margin-top: 4px; }

    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
    .link-blink { animation: blink 1s infinite; }
  </style>
</head>
<body>

<!-- 지도 -->
<div id="map-wrapper">
  <div id="map-container">
    <img id="map-image" src="fullmap.png" alt="지도">
    <svg id="map-overlay"></svg>
  </div>
  <div id="zoom-bar">
    <button id="zoom-out" class="zoom-btn">-</button>
    <span id="zoom-label">100%</span>
    <button id="zoom-in" class="zoom-btn">+</button>
  </div>
</div>

<!-- 채팅 -->
<div id="chat-section">
  <div id="chat-header">
    <span>채팅</span>
  </div>
  <div id="chat-messages"></div>
  <form id="chat-form">
    <input id="chat-input" placeholder="메시지 입력..." autocomplete="off">
    <button id="chat-send-btn" type="submit">전송</button>
  </form>
</div>

<!-- 팀 구성 -->
<div id="team-section">
  <h3>팀 구성 <a id="taego-link" href="https://script.google.com/macros/s/AKfycbzphmhTURMTavq1VI3U4nNv-znUn4wQRnGPYHm_ijoxXVlJBupMThpy8soW0LpWcHZd-g/exec?view=list" target="_blank">태고전력표</a></h3>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCLoTe7mwaCbZwdfWboOwai2-CyKX-Pjx8",
  authDomain: "fir-console-90c30.firebaseapp.com",
  databaseURL: "https://fir-console-90c30-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "fir-console-90c30",
  storageBucket: "fir-console-90c30.firebasestorage.app",
  messagingSenderId: "476568239405",
  appId: "1:476568239405:web:6b779644d4e0c1b39827a4"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const nodesRef = db.ref("mapNodes");
const linksRef = db.ref("mapLinks");
const chatRef = db.ref("chat");

let zoomLevel = 1;
const zoomLabel = document.getElementById("zoom-label");
document.getElementById("zoom-in").onclick = ()=>{ zoomLevel=Math.min(5.0,zoomLevel+0.1); updateZoom(); };
document.getElementById("zoom-out").onclick= ()=>{ zoomLevel=Math.max(0.5,zoomLevel-0.1); updateZoom(); };
function updateZoom(){ zoomLabel.textContent=Math.round(zoomLevel*100)+"%"; document.getElementById("map-image").style.width=(zoomLevel*100)+"%"; drawAll(); }

let nodes={},links={};
nodesRef.on("value",s=>{nodes=s.val()||{};drawAll();});
linksRef.on("value",s=>{links=s.val()||{};drawAll();});

const overlay=document.getElementById("map-overlay"),mapImage=document.getElementById("map-image");
function getPos(e){const r=mapImage.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};}
function toScreen(n){const r=mapImage.getBoundingClientRect();return{x:n.x*r.width,y:n.y*r.height};}

let arrowStart=null;
function drawAll(){
  const r=mapImage.getBoundingClientRect(); overlay.innerHTML=""; overlay.setAttribute("width",r.width); overlay.setAttribute("height",r.height);
  Object.entries(links).forEach(([id,l])=>{
    const a=nodes[l.from],b=nodes[l.to]; if(!a||!b)return;
    const p1=toScreen(a),p2=toScreen(b);
    const line=document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute("x1",p1.x);line.setAttribute("y1",p1.y);
    line.setAttribute("x2",p2.x);line.setAttribute("y2",p2.y);
    line.setAttribute("stroke",l.color||a.color||"#fff");
    line.setAttribute("stroke-width","2");
    line.classList.add("link-blink");
    line.onclick=ev=>{ev.stopPropagation();if(confirm("화살표를 삭제할까요?"))linksRef.child(id).remove();};
    overlay.appendChild(line);
  });
  Object.entries(nodes).forEach(([id,n])=>{
    const p=toScreen(n);
    const g=document.createElementNS("http://www.w3.org/2000/svg","g");
    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",p.x);c.setAttribute("cy",p.y);c.setAttribute("r",5);c.setAttribute("fill",n.color||"#fff");
    g.appendChild(c);
    const t=document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x",p.x);t.setAttribute("y",p.y+10);t.setAttribute("fill","#fff");t.setAttribute("font-size","9");t.textContent=n.name||"";
    g.appendChild(t); overlay.appendChild(g);
    g.onclick=ev=>{
      ev.stopPropagation();
      if(arrowStart && arrowStart!==id){
        const color=prompt("화살표 색 (1=빨강,2=파랑,3=형광초록)","1");
        const col=color==="2"?"#2196f3":color==="3"?"#00ff7f":"#ff5252";
        linksRef.push({from:arrowStart,to:id,color:col});
        arrowStart=null; alert("화살표 생성됨");
        return;
      }
      const m=document.createElement("div");
      m.id="node-menu";m.style.left=ev.clientX+"px";m.style.top=ev.clientY+"px";
      m.innerHTML=`
        <button class="node-menu-btn" onclick="editNode('${id}')">색/이름 변경</button>
        <button class="node-menu-btn" onclick="deleteNode('${id}')">거점 삭제</button>
        <button class="node-menu-btn" onclick="startArrow('${id}')">화살표 연결</button>`;
      document.body.appendChild(m);
      document.addEventListener("click",()=>m.remove(),{once:true});
    };
  });
}

window.editNode=id=>{
  const n=nodes[id];const name=prompt("이름:",n.name||"");
  const color=prompt("색 (hex):",n.color||"#fff");
  nodesRef.child(id).update({name,color});
};
window.deleteNode=id=>{
  if(!confirm("삭제?"))return;
  Object.entries(links).forEach(([lid,l])=>{if(l.from===id||l.to===id)linksRef.child(lid).remove();});
  nodesRef.child(id).remove();
};
window.startArrow=id=>{arrowStart=id;alert("화살표 시작점 선택됨");};

mapImage.onclick=e=>{
  const pos=getPos(e);
  const color=prompt("색 (hex):","#ffffff");
  const name=prompt("거점 이름:","거점");
  nodesRef.push({x:pos.x,y:pos.y,color,name});
};

// 채팅
const chatBox=document.getElementById("chat-messages");
chatRef.on("child_added",s=>{
  const d=s.val();
  const div=document.createElement("div");
  div.className="chat-msg";
  div.innerHTML=`<span class='chat-nick'>${d.nick||"익명"}:</span>${d.text}`;
  chatBox.appendChild(div); chatBox.scrollTop=chatBox.scrollHeight;
});
document.getElementById("chat-form").onsubmit=e=>{
  e.preventDefault();
  const text=document.getElementById("chat-input").value.trim();
  if(!text)return;
  chatRef.push({nick:"익명",text});
  document.getElementById("chat-input").value="";
};
</script>
</body>
</html>
