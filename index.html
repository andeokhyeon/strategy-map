<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>전략 지도 보드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0c0c0c;
      color: #f5f5f5;
    }
    .app {
      display: flex;
      flex-direction: row;
      height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      background: #111;
    }
    #main-column { flex: 3; display: flex; flex-direction: column; }
    #side-panel {
      flex: 1.2;
      border-left: 1px solid #333;
      background: #111;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 230px;
    }
    .side-box {
      background: #141414;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 8px 10px;
    }
    .side-title { font-weight: 600; margin-bottom: 6px; font-size: 13px; display: flex; justify-content: space-between; }
    #online-list { max-height: 80px; overflow-y: auto; font-size: 12px; color: #ccc; }
    .team-block { border: 1px solid #333; border-radius: 8px; padding: 6px 7px; background: #171717; margin-bottom: 6px; }
    .team-row { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
    .team-name { flex: 1; border-radius: 6px; border: 1px solid #333; background: #181818; color: #f5f5f5; padding: 4px 6px; }
    .team-members { display: flex; flex-wrap: wrap; gap: 4px; min-height: 20px; font-size: 11px; }
    .team-member-pill { padding: 2px 6px; border-radius: 999px; background: #222; border: 1px solid #444; cursor: pointer; }
    .team-add-btn { border-radius: 999px; border: 1px solid #444; background: #202020; color: #f5f5f5; font-size: 11px; padding: 3px 8px; cursor: pointer; }
    #pungun-link-btn { border-radius: 999px; border: 1px solid #444; background: #222; color: #ffda6b; font-size: 11px; padding: 3px 8px; cursor: pointer; }

    #map-container { position: relative; width: 100%; flex: 0 0 55vh; background: #000; overflow: hidden; }
    #map-inner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(1); transform-origin: center center; cursor: grab; }
    #map-inner.dragging { cursor: grabbing; }
    #map-image { width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; }
    #draw-canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; }
    #zoom-controls {
      position: absolute; right: 10px; top: 10px;
      display: flex; gap: 4px; background: rgba(0,0,0,0.5);
      padding: 4px; border-radius: 999px; border: 1px solid #444;
      z-index: 10;
    }
    .zoom-btn { width: 26px; height: 26px; border-radius: 999px; border: 1px solid #555; background: #222; color: #f5f5f5; font-size: 16px; cursor: pointer; }

    #tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; background: #181818; border-bottom: 1px solid #333; }
    .color-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #444; cursor: pointer; }
    .color-btn.active { border-color: #fff; box-shadow: 0 0 6px rgba(255,255,255,0.6); }
    .clear-group { margin-left: auto; display: flex; gap: 4px; }
    .clear-btn { border: 1px solid #444; background: #222; color: #f5f5f5; border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer; }
    #chat { flex: 1; display: flex; flex-direction: column; background: #101010; }
    #nickname-bar { padding: 6px 10px; font-size: 12px; background: #181818; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
    #chat-clear-btn { border-radius: 999px; border: 1px solid #444; padding: 3px 10px; font-size: 12px; background: #222; color: #f5f5f5; cursor: pointer; }
    #chat-messages { flex: 1; overflow-y: auto; padding: 8px 10px; font-size: 14px; }
    .chat-msg { margin-bottom: 4px; word-wrap: break-word; }
    .chat-nick { font-weight: 600; margin-right: 4px; color: #ffcc66; }
    .chat-time { font-size: 11px; color: #777; margin-left: 4px; }
    #chat-form { display: flex; border-top: 1px solid #333; padding: 6px 8px; gap: 6px; }
    #chat-input { flex: 1; border-radius: 999px; border: 1px solid #333; padding: 8px 12px; font-size: 14px; background: #181818; color: #f5f5f5; }
    #chat-send { border-radius: 999px; border: none; padding: 0 14px; font-size: 14px; background: #3f8cff; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
<div class="app">
  <div id="main-column">
    <div id="map-container">
      <div id="map-inner">
        <img id="map-image" src="map.jpg" alt="지도">
        <canvas id="draw-canvas"></canvas>
      </div>
      <div id="zoom-controls">
        <button class="zoom-btn" data-zoom="out">−</button>
        <button class="zoom-btn" data-zoom="in">+</button>
      </div>
    </div>

    <div id="tools">
      <span>색 선택:</span>
      <div id="color-palette">
        <button class="color-btn" data-color="red" style="background:#e53935"></button>
        <button class="color-btn" data-color="orange" style="background:#fb8c00"></button>
        <button class="color-btn" data-color="yellow" style="background:#fdd835"></button>
        <button class="color-btn" data-color="green" style="background:#43a047"></button>
        <button class="color-btn" data-color="blue" style="background:#1e88e5"></button>
        <button class="color-btn" data-color="white" style="background:#fff"></button>
        <button class="color-btn" data-color="black" style="background:#000"></button>
      </div>
      <div class="clear-group">
        <button class="clear-btn" data-clear="red">빨 초기화</button>
        <button class="clear-btn" data-clear="orange">주 초기화</button>
        <button class="clear-btn" data-clear="yellow">노 초기화</button>
        <button class="clear-btn" data-clear="green">초 초기화</button>
        <button class="clear-btn" data-clear="blue">파 초기화</button>
        <button class="clear-btn" data-clear="black">검 초기화</button>
        <button class="clear-btn" data-clear="white">흰 초기화🔒</button>
      </div>
    </div>

    <div id="chat">
      <div id="nickname-bar">
        <span id="nickname-label"></span>
        <button id="chat-clear-btn">채팅 초기화</button>
      </div>
      <div id="chat-messages"></div>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="메시지 입력...">
        <button id="chat-send" type="submit">전송</button>
      </form>
    </div>
  </div>

  <div id="side-panel">
    <div class="side-box">
      <div class="side-title"><span>접속자 <span id="online-count">0</span>명</span></div>
      <div id="online-list">접속자 없음</div>
    </div>
    <div class="side-box">
      <div class="side-title"><span>팀 짜기</span><button id="pungun-link-btn">-풍운 병력확인-</button></div>
      <div id="teams-list"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
<script>
// ✅ Firebase 초기화
const firebaseConfig = {
  apiKey: "AIzaSyCMoeTtI9MbhdZcIlpUyGni4aUL6Tdx6W0",
  authDomain: "fir-console-90c30.firebaseapp.com",
  databaseURL: "https://fir-console-90c30-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "fir-console-90c30",
  storageBucket: "fir-console-90c30.appspot.com",
  messagingSenderId: "397803224678",
  appId: "1:397803224678:web:cf65dc4631d438dd0a59a9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ================================
// 👇 공통 변수
// ================================
let nickname = prompt("닉네임을 입력하세요") || "익명";
document.getElementById("nickname-label").textContent = nickname;

let color = "red";
let isDrawing = false;
let ctx, canvas;
let drawingData = {};
let zoom = 1;
let panX = 0, panY = 0;
let isDragging = false, dragStartX = 0, dragStartY = 0;
const mapInner = document.getElementById("map-inner");

// ================================
// 🎨 지도 드로잉 + 확대/이동
// ================================
canvas = document.getElementById("draw-canvas");
ctx = canvas.getContext("2d");
function resizeCanvas() {
  canvas.width = mapInner.clientWidth;
  canvas.height = mapInner.clientHeight;
  redrawAll();
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

document.querySelectorAll(".color-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".color-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    color = btn.dataset.color;
  });
});
document.querySelector(".color-btn[data-color='red']").classList.add("active");

canvas.addEventListener("mousedown", e=>{
  isDrawing = true;
  const rect = canvas.getBoundingClientRect();
  draw(e.clientX - rect.left, e.clientY - rect.top);
});
canvas.addEventListener("mousemove", e=>{
  if(!isDrawing) return;
  const rect = canvas.getBoundingClientRect();
  draw(e.clientX - rect.left, e.clientY - rect.top);
});
canvas.addEventListener("mouseup", ()=>isDrawing=false);
canvas.addEventListener("mouseleave", ()=>isDrawing=false);

function draw(x,y){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(x,y,4,0,Math.PI*2);
  ctx.fill();
  saveDraw(x,y,color);
}

function saveDraw(x,y,c){
  const id = Date.now()+"_"+Math.random().toString(36).substr(2,5);
  db.ref("draws/"+id).set({x,y,c});
}

function redrawAll(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  Object.values(drawingData).forEach(p=>{
    ctx.fillStyle=p.c;
    ctx.beginPath();
    ctx.arc(p.x,p.y,4,0,Math.PI*2);
    ctx.fill();
  });
}

// 지도 확대 / 축소
document.querySelectorAll(".zoom-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const z = btn.dataset.zoom;
    if(z==="in") zoom *= 1.2;
    else zoom /= 1.2;
    mapInner.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  });
});

// 지도 드래그 이동
mapInner.addEventListener("mousedown", e=>{
  isDragging = true;
  dragStartX = e.clientX - panX;
  dragStartY = e.clientY - panY;
  mapInner.classList.add("dragging");
});
window.addEventListener("mousemove", e=>{
  if(!isDragging) return;
  panX = e.clientX - dragStartX;
  panY = e.clientY - dragStartY;
  mapInner.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
});
window.addEventListener("mouseup", ()=>{
  isDragging = false;
  mapInner.classList.remove("dragging");
});

// ================================
// 💬 채팅
// ================================
const chatForm = document.getElementById("chat-form");
const chatInput = document.getElementById("chat-input");
const chatMessages = document.getElementById("chat-messages");
const chatClearBtn = document.getElementById("chat-clear-btn");

chatForm.addEventListener("submit", e=>{
  e.preventDefault();
  const text = chatInput.value.trim();
  if(!text) return;
  const msg = {
    nick: nickname,
    text,
    time: new Date().toLocaleTimeString()
  };
  db.ref("chat").push(msg);
  chatInput.value="";
});

chatClearBtn.addEventListener("click", ()=>{
  const pw = prompt("비밀번호를 입력하세요");
  if(pw==="1234"){
    db.ref("chat").remove();
  }
});

db.ref("chat").on("value", snap=>{
  chatMessages.innerHTML="";
  snap.forEach(child=>{
    const m = child.val();
    const div = document.createElement("div");
    div.className="chat-msg";
    div.innerHTML = `<span class='chat-nick'>${m.nick}</span>${m.text}<span class='chat-time'>${m.time}</span>`;
    chatMessages.appendChild(div);
  });
  chatMessages.scrollTop = chatMessages.scrollHeight;
});

// ================================
// 🎯 그림 동기화 + 초기화
// ================================
db.ref("draws").on("value", snap=>{
  drawingData = snap.val() || {};
  redrawAll();
});

document.querySelectorAll(".clear-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const target = btn.dataset.clear;
    const pw = prompt("비밀번호를 입력하세요");
    if(pw==="1234"){
      db.ref("draws").once("value", snap=>{
        const data = snap.val()||{};
        Object.keys(data).forEach(k=>{
          if(data[k].c===target) db.ref("draws/"+k).remove();
        });
      });
    }
  });
});

// ================================
// 👥 접속자 표시
// ================================
const onlineRef = db.ref("online");
const myRef = onlineRef.push(nickname);
myRef.onDisconnect().remove();

onlineRef.on("value", snap=>{
  const val = snap.val() || {};
  const names = Object.values(val);
  document.getElementById("online-count").textContent = names.length;
  document.getElementById("online-list").innerHTML = names.length ? names.join(", ") : "접속자 없음";
});

// ================================
// 🧩 팀 관리
// ================================
const teamsRef = db.ref("teams");
const teamsList = document.getElementById("teams-list");

function renderTeams(snapshot){
  teamsList.innerHTML="";
  const data = snapshot.val() || {};
  for(let i=1;i<=6;i++){
    const tKey="team"+i;
    const tVal = data[tKey] || {name:"팀"+i, members:{}};

    const box=document.createElement("div");
    box.className="team-block";
    box.innerHTML=`
      <div class="team-row">
        <input class="team-name" value="${tVal.name}">
      </div>
      <div class="team-members">${Object.values(tVal.members).map(m=>`<span class='team-member-pill' data-team='${tKey}' data-name='${m}'>${m}</span>`).join("")}</div>
      <button class="team-add-btn" data-team="${tKey}">+ 팀원추가</button>
    `;
    teamsList.appendChild(box);
  }
}
teamsRef.on("value", renderTeams);

teamsList.addEventListener("input", e=>{
  if(e.target.classList.contains("team-name")){
    const teamKey = e.target.closest(".team-block").querySelector(".team-add-btn").dataset.team;
    db.ref("teams/"+teamKey+"/name").set(e.target.value);
  }
});

teamsList.addEventListener("click", e=>{
  if(e.target.classList.contains("team-add-btn")){
    const teamKey = e.target.dataset.team;
    const newMember = prompt("팀원 이름을 입력하세요");
    if(newMember){
      const memberKey = Date.now();
      db.ref(`teams/${teamKey}/members/${memberKey}`).set(newMember);
    }
  }
  if(e.target.classList.contains("team-member-pill")){
    const teamKey = e.target.dataset.team;
    const name = e.target.dataset.name;
    if(confirm(`${name} 을(를) 삭제할까요?`)){
      db.ref(`teams/${teamKey}/members`).once("value", snap=>{
        snap.forEach(c=>{
          if(c.val()===name) db.ref(`teams/${teamKey}/members/${c.key}`).remove();
        });
      });
    }
  }
});

// 풍운 병력확인 버튼
document.getElementById("pungun-link-btn").addEventListener("click", ()=>{
  window.open("https://script.google.com/macros/s/AKfycbzphmhTURMTavq1VI3U4nNv-znUn4wQRnGPYHm_ijoxXVlJBupMThpy8soW0LpWcHZd-g/exec","_blank");
});





</script>
</body>
</html>
