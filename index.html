<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>전략 지도 보드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0c0c0c;
      color: #f5f5f5;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 900px;
      margin: 0 auto;
      background: #111;
    }

    /* ===== 지도 영역 ===== */
    #map-container {
      position: relative;
      width: 100%;
      flex: 0 0 55vh;
      max-height: 60vh;
      background: #000;
      overflow: hidden;
    }
    #map-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    #draw-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* ===== 색 선택 & 초기화 ===== */
    #tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #181818;
      border-bottom: 1px solid #333;
      font-size: 13px;
    }
    #color-palette {
      display: flex;
      gap: 6px;
      margin-left: 6px;
    }
    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #444;
      outline: none;
      padding: 0;
      cursor: pointer;
    }
    .color-btn.active {
      border-color: #fff;
      box-shadow: 0 0 6px rgba(255,255,255,0.6);
    }
    .color-btn[data-color="white"] {
      background: #fff;
    }
    .color-btn[data-color="black"] {
      background: #000;
    }

    .clear-group {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .clear-btn {
      border: 1px solid #444;
      background: #222;
      color: #f5f5f5;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .clear-btn:hover {
      background: #333;
    }

    /* ===== 채팅 영역 ===== */
    #chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #101010;
    }
    #nickname-bar {
      padding: 6px 10px;
      font-size: 12px;
      background: #181818;
      border-bottom: 1px solid #333;
      color: #aaa;
    }
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      font-size: 14px;
    }
    .chat-msg {
      margin-bottom: 4px;
      word-wrap: break-word;
    }
    .chat-nick {
      font-weight: 600;
      margin-right: 4px;
      color: #ffcc66;
    }
    .chat-time {
      font-size: 11px;
      color: #777;
      margin-left: 4px;
    }

    #chat-form {
      display: flex;
      border-top: 1px solid #333;
      padding: 6px 8px;
      gap: 6px;
    }
    #chat-input {
      flex: 1;
      border-radius: 999px;
      border: 1px solid #333;
      padding: 8px 12px;
      font-size: 14px;
      background: #181818;
      color: #f5f5f5;
      outline: none;
    }
    #chat-input::placeholder {
      color: #666;
    }
    #chat-send {
      border-radius: 999px;
      border: none;
      padding: 0 14px;
      font-size: 14px;
      background: #3f8cff;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }
    #chat-send:active {
      opacity: 0.8;
    }

    @media (max-width: 480px) {
      #tools {
        font-size: 12px;
      }
      .clear-btn {
        font-size: 10px;
        padding: 3px 6px;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <!-- ===== 지도 + 드로잉 ===== -->
  <div id="map-container">
    <img id="map-image" src="map.jpg" alt="지도">
    <canvas id="draw-canvas"></canvas>
  </div>

  <!-- ===== 색 선택 & 초기화 ===== -->
  <div id="tools">
    <span>색 선택:</span>
    <div id="color-palette">
      <button class="color-btn" data-color="red"   title="빨간색" style="background:#e53935;"></button>
      <button class="color-btn" data-color="orange" title="주황색" style="background:#fb8c00;"></button>
      <button class="color-btn" data-color="yellow" title="노란색" style="background:#fdd835;"></button>
      <button class="color-btn" data-color="green"  title="초록색" style="background:#43a047;"></button>
      <button class="color-btn" data-color="blue"   title="파란색" style="background:#1e88e5;"></button>
      <button class="color-btn" data-color="white"  title="흰색"></button>
      <button class="color-btn" data-color="black"  title="검은색"></button>
    </div>

    <div class="clear-group">
      <button class="clear-btn" data-clear="red">빨 초기화</button>
      <button class="clear-btn" data-clear="orange">주 초기화</button>
      <button class="clear-btn" data-clear="yellow">노 초기화</button>
      <button class="clear-btn" data-clear="green">초 초기화</button>
      <button class="clear-btn" data-clear="blue">파 초기화</button>
      <button class="clear-btn" data-clear="black">검 초기화</button>
      <button class="clear-btn" data-clear="white">흰 초기화🔒</button>
    </div>
  </div>

  <!-- ===== 채팅 ===== -->
  <div id="chat">
    <div id="nickname-bar"></div>
    <div id="chat-messages"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="메시지 입력..." autocomplete="off">
      <button id="chat-send" type="submit">전송</button>
    </form>
  </div>
</div>

<!-- Firebase v8 (안정 버전) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  // 네 Firebase 설정 (그대로 넣어둠)
  const firebaseConfig = {
    apiKey: "AIzaSyCLoTe7mwaCbZwdfWboOwai2-CyKX-Pjx8",
    authDomain: "fir-console-90c30.firebaseapp.com",
    databaseURL: "https://fir-console-90c30-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "fir-console-90c30",
    storageBucket: "fir-console-90c30.firebasestorage.app",
    messagingSenderId: "476568239405",
    appId: "1:476568239405:web:6b779644d4e0c1b39827a4",
    measurementId: "G-KE0TQV1XRJ"
  };

  // Firebase 초기화
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const drawingsRef = db.ref("drawings");
  const chatRef     = db.ref("chat");

  // ===== 닉네임 =====
  let nickname = window.prompt("닉네임을 입력하세요") || "";
  nickname = nickname.trim();
  if (!nickname) {
    nickname = "손님" + Math.floor(Math.random() * 10000);
  }
  const nicknameBar = document.getElementById("nickname-bar");
  nicknameBar.textContent = "현재 닉네임: " + nickname;

  // ===== DOM =====
  const canvas       = document.getElementById("draw-canvas");
  const mapContainer = document.getElementById("map-container");
  const ctx          = canvas.getContext("2d");

  const colorButtons = document.querySelectorAll(".color-btn");
  const clearButtons = document.querySelectorAll(".clear-btn");

  const chatMessages = document.getElementById("chat-messages");
  const chatForm     = document.getElementById("chat-form");
  const chatInput    = document.getElementById("chat-input");

  // ===== 색 관련 =====
  let currentColor = "red";

  const colorMap = {
    red:    "#e53935",
    orange: "#fb8c00",
    yellow: "#fdd835",
    green:  "#43a047",
    blue:   "#1e88e5",
    white:  "#ffffff",
    black:  "#000000",
  };

  function setActiveColor(color) {
    currentColor = color;
    colorButtons.forEach(btn => {
      btn.classList.toggle("active", btn.dataset.color === color);
    });
  }

  colorButtons.forEach(btn => {
    btn.addEventListener("click", () => setActiveColor(btn.dataset.color));
  });
  setActiveColor("red");

  /* ===== 드로잉 데이터 (여기를 리사이즈보다 위로!) ===== */
  let drawingData = {};

  drawingsRef.on("value", snapshot => {
    drawingData = snapshot.val() || {};
    redrawAll();
  });

  // ===== 캔버스 리사이즈 =====
  function resizeCanvas() {
    const rect = mapContainer.getBoundingClientRect();
    const dpr  = window.devicePixelRatio || 1;

    canvas.width  = rect.width * dpr;
    canvas.height = rect.height * dpr;

    canvas.style.width  = rect.width + "px";
    canvas.style.height = rect.height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redrawAll();
  }
  window.addEventListener("resize", resizeCanvas);
  window.addEventListener("orientationchange", resizeCanvas);
  resizeCanvas();

  // ===== 전체 다시 그리기 =====
  function redrawAll() {
    if (!ctx) return;
    const rect = canvas.getBoundingClientRect();
    const width  = rect.width;
    const height = rect.height;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    Object.keys(drawingData || {}).forEach(color => {
      const colorStrokes = drawingData[color];
      if (!colorStrokes) return;

      ctx.strokeStyle = colorMap[color] || "#ffffff";
      ctx.lineWidth = 3;
      ctx.lineCap   = "round";

      Object.values(colorStrokes).forEach(seg => {
        ctx.beginPath();
        ctx.moveTo(seg.x1 * width, seg.y1 * height);
        ctx.lineTo(seg.x2 * width, seg.y2 * height);
        ctx.stroke();
      });
    });
  }

  // ===== 드로잉 이벤트 =====
  let isDrawing = false;
  let lastX = 0;
  let lastY = 0;

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX, clientY;

    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }

    const x = (clientX - rect.left) / rect.width;
    const y = (clientY - rect.top) / rect.height;
    return { x, y };
  }

  function startDrawing(e) {
    e.preventDefault();
    const pos = getPos(e);
    isDrawing = true;
    lastX = pos.x;
    lastY = pos.y;
  }

  function drawMove(e) {
    if (!isDrawing) return;
    e.preventDefault();
    const pos = getPos(e);

    const seg = {
      x1: lastX,
      y1: lastY,
      x2: pos.x,
      y2: pos.y,
    };

    const colorRef = db.ref("drawings/" + currentColor);
    colorRef.push(seg);

    lastX = pos.x;
    lastY = pos.y;
  }

  function stopDrawing(e) {
    if (!isDrawing) return;
    e && e.preventDefault();
    isDrawing = false;
  }

  canvas.addEventListener("mousedown", startDrawing);
  canvas.addEventListener("mousemove", drawMove);
  window.addEventListener("mouseup", stopDrawing);

  canvas.addEventListener("touchstart", startDrawing, { passive: false });
  canvas.addEventListener("touchmove",  drawMove,     { passive: false });
  window.addEventListener("touchend",   stopDrawing,  { passive: false });
  window.addEventListener("touchcancel",stopDrawing,  { passive: false });

  // ===== 색별 초기화 =====
  function clearColor(color) {
    if (color === "white") {
      const pw = window.prompt("흰색을 초기화하려면 비밀번호를 입력하세요:");
      if (pw !== "1234") {
        alert("비밀번호가 틀렸습니다.");
        return;
      }
    }
    db.ref("drawings/" + color).remove();
  }

  clearButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      const color = btn.dataset.clear;
      clearColor(color);
    });
  });

  // ===== 채팅 =====
  function formatTime(ts) {
    const d = new Date(ts);
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    return hh + ":" + mm;
  }

  function addChatMessage(data) {
    const div = document.createElement("div");
    div.className = "chat-msg";

    const nickSpan = document.createElement("span");
    nickSpan.className = "chat-nick";
    nickSpan.textContent = data.nick;

    const textSpan = document.createElement("span");
    textSpan.textContent = data.text;

    const timeSpan = document.createElement("span");
    timeSpan.className = "chat-time";
    timeSpan.textContent = formatTime(data.time || Date.now());

    div.appendChild(nickSpan);
    div.appendChild(textSpan);
    div.appendChild(timeSpan);

    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  chatRef.on("child_added", snapshot => {
    const val = snapshot.val();
    if (!val) return;
    addChatMessage(val);
  });

  chatForm.addEventListener("submit", e => {
    e.preventDefault();
    const text = chatInput.value.trim();
    if (!text) return;

    const msg = {
      nick: nickname,
      text,
      time: Date.now(),
    };
    chatRef.push(msg);
    chatInput.value = "";
  });
</script>
</body>
</html>
