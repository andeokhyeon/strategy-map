<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>모바일 전략 지도 보드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0c0c0c;
      color: #f5f5f5;
      overflow-x: hidden;
    }

    /* ===== 공통 영역 ===== */
    .section {
      border-top: 1px solid #222;
      background: #111;
      padding: 8px;
    }

    /* ===== 지도 ===== */
    #map-wrapper {
      position: relative;
      width: 100%;
      height: 55vh;
      overflow: hidden;
      touch-action: none;
      background: #000;
    }
    #map-container {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }
    #map-image {
      width: 100%;
      height: auto;
      transform-origin: center center;
      touch-action: none;
    }
    #map-overlay {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
    }

    /* ===== 채팅 + 접속자 ===== */
    #chat-section {
      background: #101010;
      padding: 6px;
    }
    #chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 4px;
    }
    #chat-messages {
      max-height: 25vh;
      overflow-y: auto;
      background: #181818;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .chat-msg { margin-bottom: 4px; }
    .chat-nick { font-weight: 600; color: #ffcc66; margin-right: 4px; }
    .chat-time { font-size: 11px; color: #777; margin-left: 6px; }
    #chat-form {
      display: flex;
      gap: 6px;
    }
    #chat-input {
      flex: 1;
      border-radius: 999px;
      border: 1px solid #333;
      padding: 8px 10px;
      background: #181818;
      color: #fff;
    }
    #chat-send-btn {
      border: none;
      border-radius: 999px;
      background: #3f8cff;
      color: #fff;
      padding: 0 14px;
      cursor: pointer;
    }

    /* ===== 접속자 ===== */
    #presence-info {
      font-size: 12px;
      color: #ccc;
      margin-bottom: 4px;
    }

    /* ===== 팀 구성 ===== */
    #team-section {
      background: #141414;
      padding: 8px;
    }
    .team-card {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 6px;
      margin-bottom: 6px;
    }
    .team-name-input {
      width: 100%;
      background: #181818;
      color: #fff;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 3px 5px;
      margin-bottom: 4px;
    }
    .team-members {
      max-height: 70px;
      overflow-y: auto;
      font-size: 12px;
      margin-bottom: 4px;
      list-style: none;
      padding: 0;
    }
    .team-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .small-btn {
      background: #2f2f2f;
      color: #eee;
      border: none;
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 11px;
      cursor: pointer;
    }

    /* ===== 색 선택 팝업 ===== */
    #color-picker {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.45);
      z-index: 100;
    }
    #color-picker-panel {
      background: #222;
      border: 1px solid #555;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .cp-color {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #444;
      display: inline-block;
      margin: 4px;
      cursor: pointer;
    }
    .cp-color.active {
      border-color: #fff;
      box-shadow: 0 0 5px rgba(255,255,255,0.9);
    }

    /* ===== 거점 모양 선택 ===== */
    #shape-picker {
      margin-top: 6px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .shape-option {
      background: #2a2a2a;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 13px;
    }
    .shape-option.active {
      background: #3f8cff;
    }

    /* ===== 거점 이름 라벨 ===== */
    .node-label {
      font-size: 10px;
      fill: #fff;
      text-anchor: middle;
      dominant-baseline: hanging;
    }
    .node-label-bg {
      fill: rgba(0,0,0,0.75);
      rx: 3;
      ry: 3;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .link-blink { animation: blink 1s infinite; }

    /* ===== 반응형 ===== */
    @media (max-width: 600px) {
      #map-wrapper { height: 45vh; }
      #chat-messages { max-height: 20vh; }
    }
  </style>
</head>
<body>

<!-- ===== 지도 섹션 ===== -->
<div id="map-wrapper">
  <div id="map-container">
    <img id="map-image" src="fullmap.png" alt="지도">
    <svg id="map-overlay"></svg>
  </div>
</div>

<!-- ===== 채팅 + 접속자 ===== -->
<div id="chat-section">
  <div id="chat-header">
    <div>
      <strong id="nickname-display">닉네임</strong>
      <span id="presence-info"></span>
    </div>
    <button id="change-nick" class="small-btn">닉네임 변경</button>
  </div>

  <div id="chat-messages"></div>

  <form id="chat-form">
    <input id="chat-input" placeholder="메시지 입력..." autocomplete="off">
    <button id="chat-send-btn" type="submit">전송</button>
  </form>
</div>

<!-- ===== 팀 구성 섹션 ===== -->
<div id="team-section">
  <h3 style="font-size:14px;margin-top:0;">팀 구성</h3>
  <div id="teams"></div>
</div>

<!-- ===== 색상 + 모양 선택 팝업 ===== -->
<div id="color-picker">
  <div id="color-picker-panel">
    <div style="margin-bottom:6px;">색상 선택 후 모양을 고르세요</div>
    <div id="color-picker-colors"></div>
    <div id="shape-picker">
      <button class="shape-option active" data-shape="circle">⚪ 동그라미</button>
      <button class="shape-option" data-shape="sun">☀ 해</button>
      <button class="shape-option" data-shape="moon">🌙 달</button>
    </div>
    <button id="color-picker-cancel" class="small-btn" style="margin-top:8px;">취소</button>
  </div>
</div>
<!-- ===== Firebase & 기능 스크립트 ===== -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
  // ✅ Firebase 설정 (그대로 사용)
  const firebaseConfig = {
    apiKey: "AIzaSyCLoTe7mwaCbZwdfWboOwai2-CyKX-Pjx8",
    authDomain: "fir-console-90c30.firebaseapp.com",
    databaseURL: "https://fir-console-90c30-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "fir-console-90c30",
    storageBucket: "fir-console-90c30.firebasestorage.app",
    messagingSenderId: "476568239405",
    appId: "1:476568239405:web:6b779644d4e0c1b39827a4",
    measurementId: "G-KE0TQV1XRJ"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const nodesRef = db.ref("mapNodes");
  const linksRef = db.ref("mapLinks");
  const chatRef  = db.ref("chat");
  const presenceRef = db.ref("presence");
  const teamsRef = db.ref("teams");

  // ===== 지도 확대/축소 =====
  const mapContainer = document.getElementById("map-container");
  const mapImage = document.getElementById("map-image");
  const overlay = document.getElementById("map-overlay");
  let scale = 1;
  let originX = 0, originY = 0;
  let startDist = 0;

  mapContainer.addEventListener("wheel", e => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 1.1 : 0.9;
    scale *= delta;
    scale = Math.min(Math.max(0.5, scale), 3);
    mapImage.style.transform = `scale(${scale})`;
  });

  mapContainer.addEventListener("touchstart", e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      startDist = Math.sqrt(dx * dx + dy * dy);
    }
  }, { passive: false });

  mapContainer.addEventListener("touchmove", e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const newDist = Math.sqrt(dx * dx + dy * dy);
      scale *= newDist / startDist;
      scale = Math.min(Math.max(0.5, scale), 3);
      mapImage.style.transform = `scale(${scale})`;
      startDist = newDist;
    }
  }, { passive: false });

  // ===== 지도 거점 및 화살표 =====
  let nodes = {};
  let links = {};
  let currentColor = "#e53935";
  let currentShape = "circle";
  let arrowStartNode = null;

  const colorPicker = document.getElementById("color-picker");
  const cpContainer = document.getElementById("color-picker-colors");
  const shapeButtons = document.querySelectorAll(".shape-option");
  const cancelPicker = document.getElementById("color-picker-cancel");

  const colors = [
    "#e53935","#fb8c00","#fdd835","#43a047","#1e88e5","#8e24aa","#00acc1",
    "#d81b60","#3949ab","#5e35b1","#f06292","#26c6da","#81c784","#cddc39",
    "#ffb300","#6d4c41","#546e7a","#9e9d24","#ff7043","#ffffff"
  ];
  colors.forEach(c=>{
    const el=document.createElement("div");
    el.className="cp-color";
    el.style.background=c;
    el.dataset.color=c;
    cpContainer.appendChild(el);
  });

  let pickerCallback=null;
  function openColorPicker(cb){
    pickerCallback=cb;
    colorPicker.style.display="flex";
  }
  cancelPicker.onclick=()=>{colorPicker.style.display="none";pickerCallback=null;};

  cpContainer.addEventListener("click",e=>{
    if(e.target.classList.contains("cp-color")){
      const color=e.target.dataset.color;
      currentColor=color;
      if(pickerCallback){
        pickerCallback(color,currentShape);
        pickerCallback=null;
      }
      colorPicker.style.display="none";
    }
  });
  shapeButtons.forEach(btn=>{
    btn.addEventListener("click",()=>{
      shapeButtons.forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      currentShape=btn.dataset.shape;
    });
  });

  mapContainer.addEventListener("click",e=>{
    const rect=mapImage.getBoundingClientRect();
    const x=(e.clientX-rect.left)/rect.width;
    const y=(e.clientY-rect.top)/rect.height;
    openColorPicker((color,shape)=>{
      const name=prompt("거점 이름:");
      if(!name)return;
      nodesRef.push({x,y,color,shape,name});
    });
  });

  nodesRef.on("value",snap=>{nodes=snap.val()||{};drawAll();});
  linksRef.on("value",snap=>{links=snap.val()||{};drawAll();});

  function toScreenPos(node){
    const rect=mapImage.getBoundingClientRect();
    return {x:node.x*rect.width,y:node.y*rect.height};
  }

  function drawAll(){
    overlay.innerHTML="";
    const rect=mapImage.getBoundingClientRect();
    overlay.setAttribute("width",rect.width);
    overlay.setAttribute("height",rect.height);

    const defs=document.createElementNS("http://www.w3.org/2000/svg","defs");
    const marker=document.createElementNS("http://www.w3.org/2000/svg","marker");
    marker.setAttribute("id","arrow-head");
    marker.setAttribute("markerWidth","7");
    marker.setAttribute("markerHeight","7");
    marker.setAttribute("refX","5");
    marker.setAttribute("refY","3.5");
    marker.setAttribute("orient","auto");
    marker.setAttribute("markerUnits","strokeWidth");
    const mp=document.createElementNS("http://www.w3.org/2000/svg","path");
    mp.setAttribute("d","M0,0 L5,3.5 L0,7 z");
    mp.setAttribute("fill","currentColor");
    marker.appendChild(mp);defs.appendChild(marker);overlay.appendChild(defs);

    // 화살표
    Object.entries(links||{}).forEach(([id,link])=>{
      const from=nodes[link.from];const to=nodes[link.to];
      if(!from||!to)return;
      const p1=toScreenPos(from),p2=toScreenPos(to);
      const path=document.createElementNS("http://www.w3.org/2000/svg","path");
      path.setAttribute("d",`M${p1.x} ${p1.y} L${p2.x} ${p2.y}`);
      const color=from.color||"#fff";
      path.setAttribute("stroke",color);
      path.style.color=color;
      path.setAttribute("stroke-width","3");
      path.setAttribute("fill","none");
      path.classList.add("link-blink");
      path.setAttribute("marker-end","url(#arrow-head)");
      path.style.pointerEvents="auto";
      path.onclick=()=>{if(confirm("삭제?"))linksRef.child(id).remove();};
      overlay.appendChild(path);
    });

    // 노드
    Object.entries(nodes||{}).forEach(([id,node])=>{
      const p=toScreenPos(node);
      const g=document.createElementNS("http://www.w3.org/2000/svg","g");
      g.style.pointerEvents="auto";
      const shape=node.shape||"circle";
      let element;
      if(shape==="circle"){
        element=document.createElementNS("http://www.w3.org/2000/svg","circle");
        element.setAttribute("r",6);
        element.setAttribute("cx",p.x);
        element.setAttribute("cy",p.y);
      }else{
        element=document.createElementNS("http://www.w3.org/2000/svg","text");
        element.setAttribute("x",p.x-5);
        element.setAttribute("y",p.y+4);
        element.textContent=shape==="sun"?"☀":shape==="moon"?"🌙":"⚪";
      }
      element.setAttribute("fill",node.color||"#fff");
      g.appendChild(element);

      const labelBg=document.createElementNS("http://www.w3.org/2000/svg","rect");
      const label=document.createElementNS("http://www.w3.org/2000/svg","text");
      label.textContent=node.name||"";
      label.setAttribute("x",p.x);
      label.setAttribute("y",p.y+10);
      label.setAttribute("class","node-label");
      const bboxWidth=Math.max(30,label.textContent.length*7);
      labelBg.setAttribute("x",p.x-bboxWidth/2);
      labelBg.setAttribute("y",p.y+8);
      labelBg.setAttribute("width",bboxWidth);
      labelBg.setAttribute("height",12);
      labelBg.setAttribute("fill","rgba(0,0,0,0.7)");
      g.appendChild(labelBg);
      g.appendChild(label);

      g.onclick=()=>{
        if(arrowStartNode && arrowStartNode!==id){
          linksRef.push({from:arrowStartNode,to:id});
          arrowStartNode=null;
        }else{
          const menu=confirm("1: 색상변경\n2: 삭제\n3: 화살표출발");
          if(menu){
            const sel=prompt("1=색상, 2=삭제, 3=화살표시작:");
            if(sel==="1"){
              openColorPicker(color=>{
                if(color)nodesRef.child(id).update({color});
              });
            }else if(sel==="2"){
              nodesRef.child(id).remove();
              Object.entries(links||{}).forEach(([lid,l])=>{
                if(l.from===id||l.to===id)linksRef.child(lid).remove();
              });
            }else if(sel==="3"){
              arrowStartNode=id;
            }
          }
        }
      };
      overlay.appendChild(g);
    });
  }

  // ===== 채팅 기능 =====
  const nicknameDisplay=document.getElementById("nickname-display");
  const chatMessages=document.getElementById("chat-messages");
  const chatForm=document.getElementById("chat-form");
  const chatInput=document.getElementById("chat-input");
  const changeNick=document.getElementById("change-nick");
  let nickname=localStorage.getItem("nickname")||"손님"+Math.floor(Math.random()*9999);
  nicknameDisplay.textContent=nickname;
  changeNick.onclick=()=>{
    const nn=prompt("닉네임:");
    if(nn){nickname=nn;localStorage.setItem("nickname",nn);nicknameDisplay.textContent=nn;}
  };

  chatRef.on("child_added",snap=>{
    const v=snap.val();
    const div=document.createElement("div");
    div.className="chat-msg";
    div.innerHTML=`<span class='chat-nick'>${v.nick}</span>${v.text}<span class='chat-time'>${new Date(v.time).toLocaleTimeString()}</span>`;
    chatMessages.appendChild(div);
    chatMessages.scrollTop=chatMessages.scrollHeight;
  });

  chatForm.onsubmit=e=>{
    e.preventDefault();
    const text=chatInput.value.trim();
    if(!text)return;
    chatRef.push({nick:nickname,text,time:Date.now()});
    chatInput.value="";
  };

  // ===== 접속자 표시 =====
  const presenceInfo=document.getElementById("presence-info");
  const userRef=presenceRef.push(nickname);
  userRef.onDisconnect().remove();
  presenceRef.on("value",snap=>{
    const val=snap.val()||{};
    const count=Object.keys(val).length;
    presenceInfo.textContent=`현재 접속자 ${count}명`;
  });

  // ===== 팀 구성 =====
  const teamsDiv=document.getElementById("teams");
  teamsRef.once("value",snap=>{
    if(!snap.exists()){
      for(let i=1;i<=6;i++){
        teamsRef.child("team"+i).set({name:"팀 "+i,members:{}});
      }
    }
  });

  teamsRef.on("value",snap=>{
    teamsDiv.innerHTML="";
    const teams=snap.val()||{};
    Object.entries(teams).forEach(([tid,team])=>{
      const card=document.createElement("div");
      card.className="team-card";
      const input=document.createElement("input");
      input.value=team.name||tid;
      input.className="team-name-input";
      input.onchange=()=>teamsRef.child(tid).update({name:input.value});
      card.appendChild(input);
      const ul=document.createElement("ul");
      ul.className="team-members";
      Object.entries(team.members||{}).forEach(([mid,name])=>{
        const li=document.createElement("li");
        li.textContent=name;
        ul.appendChild(li);
      });
      card.appendChild(ul);
      const addBtn=document.createElement("button");
      addBtn.className="small-btn";
      addBtn.textContent="팀원 추가 +";
      addBtn.onclick=()=>{
        const name=prompt("팀원 이름:");
        if(name)teamsRef.child(`${tid}/members`).push(name);
      };
      const clearBtn=document.createElement("button");
      clearBtn.className="small-btn";
      clearBtn.textContent="전체삭제";
      clearBtn.onclick=()=>{
        if(confirm("팀원 전부 삭제?"))teamsRef.child(`${tid}/members`).remove();
      };
      const row=document.createElement("div");
      row.className="team-buttons";
      row.appendChild(addBtn);
      row.appendChild(clearBtn);
      card.appendChild(row);
      teamsDiv.appendChild(card);
    });
  });
</script>
</body>
</html>
