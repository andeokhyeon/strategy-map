<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>모바일 전략 지도 보드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0c0c0c;
      color: #f5f5f5;
      overflow-x: hidden;
    }

    /* ===== 공통 섹션 테두리 ===== */
    #map-wrapper,
    #chat-section,
    #team-section {
      border: 1px solid #333;
      border-radius: 10px;
      margin: 6px 6px 0;
      background: #111;
    }

    /* ===== 지도 섹션 ===== */
    #map-wrapper {
      position: relative;
      width: 100%;
      height: 55vh;
      background: #000;
      overflow: hidden;
    }
    #map-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: auto;  /* 확대 후 드래그 가능 */
    }
    #map-image {
      display: block;
      width: 100%;
      height: auto;
    }
    #map-overlay {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
    }

    /* 줌 컨트롤 */
    #zoom-bar {
      position: absolute;
      right: 8px;
      top: 8px;
      z-index: 10;
      background: rgba(0,0,0,0.6);
      border-radius: 999px;
      padding: 2px 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }
    .zoom-btn {
      border: none;
      background: #2f2f2f;
      color: #eee;
      border-radius: 999px;
      width: 22px;
      height: 22px;
      font-size: 14px;
      cursor: pointer;
    }
    #zoom-label {
      min-width: 38px;
      text-align: center;
    }

    /* ===== 지도 밑 툴바(깃발 + 검색) ===== */
    #flag-bar {
      margin: 4px 6px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    #flag-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #flag-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #node-search-input {
      border-radius: 999px;
      border: 1px solid #333;
      background: #181818;
      color: #fff;
      padding: 3px 8px;
      font-size: 11px;
      width: 120px;
    }
    #node-search-input::placeholder {
      color: #777;
    }

    /* ===== 채팅 + 접속자 섹션 ===== */
    #chat-section {
      background: #101010;
      padding: 8px;
    }
    #chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 4px;
    }
    #nickname-display {
      font-weight: 600;
      color: #ffd54f;
      margin-right: 6px;
    }
    #presence-info {
      font-size: 12px;
      color: #ccc;
    }
    .small-btn {
      background: #2f2f2f;
      color: #eee;
      border: none;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .small-btn:hover {
      background: #3a3a3a;
    }
    #chat-messages {
      max-height: 35vh;
      overflow-y: auto;
      background: #181818;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .chat-msg { margin-bottom: 4px; }
    .chat-nick { font-weight: 600; color: #ffcc66; margin-right: 4px; }
    .chat-time { font-size: 11px; color: #777; margin-left: 6px; }

    #chat-form {
      display: flex;
      gap: 6px;
    }
    #chat-input {
      flex: 1;
      border-radius: 999px;
      border: 1px solid #333;
      padding: 8px 10px;
      background: #181818;
      color: #fff;
      font-size: 13px;
    }
    #chat-input::placeholder {
      color: #666;
    }
    #chat-send-btn {
      border: none;
      border-radius: 999px;
      background: #3f8cff;
      color: #fff;
      padding: 0 14px;
      cursor: pointer;
      font-size: 13px;
    }

    /* ===== 팀 구성 섹션 ===== */
    #team-section {
      background: #141414;
      padding: 8px;
      margin-bottom: 8px;
    }
    #team-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    #team-header-row h3 {
      font-size: 14px;
      margin: 0;
    }
    #taego-link {
      text-decoration: none;
      font-size: 11px;
      border-radius: 999px;
      padding: 3px 8px;
      background: #3949ab;
      color: #fff;
    }
    #taego-link:hover {
      opacity: 0.9;
    }

    .team-card {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 6px;
      margin-bottom: 6px;
    }

    /* 🔹 각 팀 색상 구분 */
    .team-card[data-color="1"] { background: #2b3e50; border-color: #5fa8d3; }
    .team-card[data-color="2"] { background: #3e2b50; border-color: #ce93d8; }
    .team-card[data-color="3"] { background: #50312b; border-color: #ffb74d; }
    .team-card[data-color="4"] { background: #2b5030; border-color: #81c784; }
    .team-card[data-color="5"] { background: #50492b; border-color: #d4e157; }
    .team-card[data-color="6"] { background: #4a2b50; border-color: #ba68c8; }

    .team-card input,
    .team-card .team-member-chip,
    .team-card .small-btn {
      color: #fff !important;
    }

    .team-name-input {
      width: 100%;
      background: #181818;
      color: #fff;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 3px 5px;
      margin-bottom: 4px;
      font-size: 12px;
    }

    .team-members {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-height: 70px;
      overflow-y: auto;
      margin: 0 0 4px 0;
      padding: 0;
    }
    .team-member-chip {
      background: rgba(255,255,255,0.15);
      border-radius: 999px;
      padding: 2px 6px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .team-member-chip:hover {
      background: rgba(255,255,255,0.25);
    }

    .team-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    /* ===== 색상 + 모양 선택 팝업 (거점) ===== */
    #color-picker {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.45);
      z-index: 100;
    }
    #color-picker-panel {
      background: #222;
      border: 1px solid #555;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      min-width: 220px;
    }
    #color-picker-colors {
      margin-bottom: 6px;
    }
    .cp-color {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #444;
      display: inline-block;
      margin: 4px;
      cursor: pointer;
    }
    .cp-color.active {
      border-color: #fff;
      box-shadow: 0 0 5px rgba(255,255,255,0.9);
    }
    #shape-picker {
      margin-top: 6px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .shape-option {
      background: #2a2a2a;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px;
    }
    .shape-option.active {
      background: #3f8cff;
    }

    /* ===== 화살표 색 선택 팝업 ===== */
    #arrow-color-picker {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.45);
      z-index: 110;
    }
    #arrow-color-panel {
      background: #222;
      border: 1px solid #555;
      border-radius: 12px;
      padding: 10px 12px;
      min-width: 200px;
      text-align: center;
    }
    #arrow-color-buttons {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
    }
    .arrow-color-btn {
      border: none;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      color: #fff;
      font-weight: 500;
    }

    /* ===== 깃발 색 선택 팝업 ===== */
    #flag-color-picker {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.45);
      z-index: 105;
    }
    #flag-color-panel {
      background: #222;
      border: 1px solid #555;
      border-radius: 12px;
      padding: 10px 12px;
      min-width: 220px;
      text-align: center;
    }
    #flag-color-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .flag-color-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #444;
      cursor: pointer;
    }

    /* ===== 거점 라벨 ===== */
    .node-label {
      font-size: 9px;
      fill: #fff;
      text-anchor: middle;
      dominant-baseline: hanging;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .link-blink { animation: blink 1s infinite; }

    /* ===== 거점/깃발 메뉴 ===== */
    #node-menu {
      position: fixed;
      z-index: 120;
      background: rgba(20,20,20,0.95);
      border-radius: 12px;
      border: 1px solid #555;
      padding: 8px;
      min-width: 170px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.8);
      backdrop-filter: blur(6px);
      font-size: 12px;
    }
    #node-menu-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #fff;
    }
    .node-menu-btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #262626;
      color: #f5f5f5;
      padding: 6px 8px;
      font-size: 12px;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .node-menu-btn + .node-menu-btn {
      margin-top: 4px;
    }
    .node-menu-btn:hover {
      background: #333;
    }
    .node-menu-icon {
      width: 16px;
      text-align: center;
      opacity: 0.9;
    }

    @media (max-width: 600px) {
      #map-wrapper { height: 45vh; }
      #chat-messages { max-height: 28vh; }
    }
  </style>
</head>
<body>

<!-- ===== 1. 지도 ===== -->
<div id="map-wrapper">
  <div id="map-container">
    <img id="map-image" src="fullmap.png" alt="지도">
    <svg id="map-overlay"></svg>
  </div>

  <!-- 확대/축소 버튼 -->
  <div id="zoom-bar">
    <button id="zoom-out" class="zoom-btn">-</button>
    <span id="zoom-label">100%</span>
    <button id="zoom-in" class="zoom-btn">+</button>
  </div>
</div>

<!-- 🔹 지도 밑: 깃발 + 거점 검색 -->
<div id="flag-bar">
  <div id="flag-left">
    <button id="add-flag-btn" class="small-btn">깃발 추가</button>
  </div>
  <div id="flag-right">
    <input id="node-search-input" placeholder="거점 검색">
    <button id="node-search-btn" class="small-btn">검색</button>
  </div>
</div>

<!-- ===== 2. 채팅 + 접속자 ===== -->
<div id="chat-section">
  <div id="chat-header">
    <div>
      <span id="nickname-display">닉네임</span>
      <span id="presence-info">접속자 0명</span>
    </div>
    <button id="change-nick" class="small-btn">닉네임 변경</button>
  </div>

  <div id="chat-messages"></div>

  <form id="chat-form">
    <input id="chat-input" placeholder="메시지 입력..." autocomplete="off">
    <button id="chat-send-btn" type="submit">전송</button>
  </form>
</div>

<!-- ===== 3. 팀 구성 ===== -->
<div id="team-section">
  <div id="team-header-row">
    <h3>팀 구성</h3>
    <a id="taego-link" href="https://script.google.com/macros/s/AKfycbzphmhTURMTavq1VI3U4nNv-znUn4wQRnGPYHm_ijoxXVlJBupMThpy8soW0LpWcHZd-g/exec?view=list" target="_blank">
      태고전력표
    </a>
  </div>
  <div id="teams"></div>
</div>

<!-- ===== 색상 + 모양 선택 팝업 (거점) ===== -->
<div id="color-picker">
  <div id="color-picker-panel">
    <div style="margin-bottom:6px;">색을 고르고 모양을 선택한 후 거점 이름을 입력하세요</div>
    <div id="color-picker-colors"></div>
    <div id="shape-picker">
      <button class="shape-option active" data-shape="circle">⚪ 동그라미</button>
      <button class="shape-option" data-shape="sun">☀ 해</button>
      <button class="shape-option" data-shape="moon">🌙 달</button>
    </div>
    <button id="color-picker-cancel" class="small-btn" style="margin-top:8px;">취소</button>
  </div>
</div>

<!-- ===== 화살표 색 선택 팝업 ===== -->
<div id="arrow-color-picker">
  <div id="arrow-color-panel">
    <div>화살표 색을 선택하세요</div>
    <div id="arrow-color-buttons">
      <button class="arrow-color-btn" data-color="#e53935" style="background:#e53935;">빨강</button>
      <button class="arrow-color-btn" data-color="#1e88e5" style="background:#1e88e5;">파랑</button>
      <button class="arrow-color-btn" data-color="#00ff66" style="background:#00ff66;color:#000;">형광초록</button>
    </div>
    <button id="arrow-color-cancel" class="small-btn" style="margin-top:8px;">취소</button>
  </div>
</div>

<!-- ===== 깃발 색 선택 팝업 ===== -->
<div id="flag-color-picker">
  <div id="flag-color-panel">
    <div>깃발 색을 선택하세요</div>
    <div id="flag-color-buttons">
      <div class="flag-color-btn" data-color="#ff1744" style="background:#ff1744;"></div>
      <div class="flag-color-btn" data-color="#2979ff" style="background:#2979ff;"></div>
      <div class="flag-color-btn" data-color="#00e676" style="background:#00e676;"></div>
      <div class="flag-color-btn" data-color="#ffea00" style="background:#ffea00;"></div>
      <div class="flag-color-btn" data-color="#f500f5" style="background:#f500f5;"></div>
    </div>
    <button id="flag-color-cancel" class="small-btn" style="margin-top:8px;">취소</button>
  </div>
</div>

<!-- Firebase & Script -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
  // Firebase 설정 (그대로)
  const firebaseConfig = {
    apiKey: "AIzaSyCLoTe7mwaCbZwdfWboOwai2-CyKX-Pjx8",
    authDomain: "fir-console-90c30.firebaseapp.com",
    databaseURL: "https://fir-console-90c30-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "fir-console-90c30",
    storageBucket: "fir-console-90c30.firebasestorage.app",
    messagingSenderId: "476568239405",
    appId: "1:476568239405:web:6b779644d4e0c1b39827a4",
    measurementId: "G-KE0TQV1XRJ"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const nodesRef    = db.ref("mapNodes");
  const linksRef    = db.ref("mapLinks");
  const flagsRef    = db.ref("flags");
  const chatRef     = db.ref("chatMessages");
  const presenceRef = db.ref("presence");
  const teamsRef    = db.ref("teams");

  // ===== 닉네임 / 접속자 =====
  let nickname = localStorage.getItem("nickname") || ("손님" + Math.floor(Math.random()*9999));
  const nicknameDisplay = document.getElementById("nickname-display");
  const presenceInfo    = document.getElementById("presence-info");
  const changeNickBtn   = document.getElementById("change-nick");
  nicknameDisplay.textContent = nickname;

  changeNickBtn.addEventListener("click", () => {
    const nn = (prompt("새 닉네임:", nickname) || "").trim();
    if (!nn) return;
    nickname = nn;
    localStorage.setItem("nickname", nickname);
    nicknameDisplay.textContent = nickname;
    if (myPresenceRef) myPresenceRef.update({ nick: nickname });
  });

  let myPresenceRef = null;
  const connectedRef = db.ref(".info/connected");
  connectedRef.on("value", snap => {
    if (snap.val() === true) {
      myPresenceRef = presenceRef.push();
      myPresenceRef.onDisconnect().remove();
      myPresenceRef.set({
        nick: nickname,
        ts: firebase.database.ServerValue.TIMESTAMP
      });
    }
  });

  presenceRef.on("value", snap => {
    const val = snap.val() || {};
    const count = Object.keys(val).length;
    presenceInfo.textContent = "현재 접속자 " + count + "명";
  });

  // ===== 채팅 =====
  const chatMessagesEl = document.getElementById("chat-messages");
  const chatForm       = document.getElementById("chat-form");
  const chatInput      = document.getElementById("chat-input");

  function formatTime(ts) {
    const d = new Date(ts);
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    return hh + ":" + mm;
  }

  function addChatMessage(data) {
    const div = document.createElement("div");
    div.className = "chat-msg";
    div.innerHTML =
      "<span class='chat-nick'>" + (data.nick || "손님") + "</span>" +
      (data.text || "") +
      "<span class='chat-time'>" + formatTime(data.time || Date.now()) + "</span>";
    chatMessagesEl.appendChild(div);
    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
  }

  chatRef.on("child_added", snap => {
    const v = snap.val();
    if (!v) return;
    addChatMessage(v);
  });

  chatForm.addEventListener("submit", e => {
    e.preventDefault();
    const text = chatInput.value.trim();
    if (!text) return;
    chatRef.push({
      nick: nickname,
      text,
      time: Date.now()
    });
    chatInput.value = "";
  });

  // ===== 팀 구성 =====
  const teamsDiv = document.getElementById("teams");

  // 처음에 팀 없으면 기본 1~6 생성
  teamsRef.once("value", snap => {
    if (!snap.exists()) {
      for (let i = 1; i <= 6; i++) {
        teamsRef.child("team" + i).set({
          name: "팀 " + i,
          members: {}
        });
      }
    }
  });

  teamsRef.on("value", snap => {
    const teams = snap.val() || {};
    teamsDiv.innerHTML = "";
    Object.entries(teams).forEach(([tid, team]) => {
      const card = document.createElement("div");
      card.className = "team-card";
      const idx = tid.replace("team", "");
      card.setAttribute("data-color", idx);   // 🔹 팀 번호에 따라 색상 다르게

      const nameInput = document.createElement("input");
      nameInput.className = "team-name-input";
      nameInput.value = team.name || tid;
      nameInput.addEventListener("change", () => {
        teamsRef.child(tid).update({ name: nameInput.value.trim() || tid });
      });
      card.appendChild(nameInput);

      // 팀원 칩
      const membersWrap = document.createElement("div");
      membersWrap.className = "team-members";
      Object.entries(team.members || {}).forEach(([mid, memberName]) => {
        const chip = document.createElement("div");
        chip.className = "team-member-chip";
        chip.textContent = memberName;
        chip.title = "클릭하면 삭제";
        chip.addEventListener("click", () => {
          if (!confirm(`"${memberName}" 삭제할까요?`)) return;
          teamsRef.child(tid).child("members").child(mid).remove();
        });
        membersWrap.appendChild(chip);
      });
      card.appendChild(membersWrap);

      const btnRow = document.createElement("div");
      btnRow.className = "team-buttons";

      const addMeBtn = document.createElement("button");
      addMeBtn.className = "small-btn";
      addMeBtn.textContent = "내 닉네임 추가";
      addMeBtn.addEventListener("click", () => {
        teamsRef.child(tid).child("members").push(nickname);
      });

      const addBtn = document.createElement("button");
      addBtn.className = "small-btn";
      addBtn.textContent = "이름 추가";
      addBtn.addEventListener("click", () => {
        const name = (prompt("추가할 이름:") || "").trim();
        if (!name) return;
        teamsRef.child(tid).child("members").push(name);
      });

      const clearBtn = document.createElement("button");
      clearBtn.className = "small-btn";
      clearBtn.textContent = "전체 삭제";
      clearBtn.addEventListener("click", () => {
        if (!confirm("이 팀의 모든 팀원을 삭제할까요?")) return;
        teamsRef.child(tid).child("members").remove();
      });

      btnRow.appendChild(addMeBtn);
      btnRow.appendChild(addBtn);
      btnRow.appendChild(clearBtn);

      card.appendChild(btnRow);
      teamsDiv.appendChild(card);
    });
  });

  // ===== 지도 / 거점 / 화살표 / 깃발 =====
  const mapImage     = document.getElementById("map-image");
  const overlay      = document.getElementById("map-overlay");
  const mapContainer = document.getElementById("map-container");

  let nodes = {};
  let links = {};
  let flags = {};

  let zoomLevel = 1;
  const zoomLabel = document.getElementById("zoom-label");
  const zoomInBtn  = document.getElementById("zoom-in");
  const zoomOutBtn = document.getElementById("zoom-out");

  function updateZoomLabel() {
    zoomLabel.textContent = Math.round(zoomLevel * 100) + "%";
  }

  function applyZoom() {
    mapImage.style.width = (zoomLevel * 100) + "%";
    drawAll();
  }

  // 최대 500% 확대
  zoomInBtn.addEventListener("click", () => {
    zoomLevel = Math.min(5.0, zoomLevel + 0.1);
    updateZoomLabel();
    applyZoom();
  });
  zoomOutBtn.addEventListener("click", () => {
    zoomLevel = Math.max(0.5, zoomLevel - 0.1);
    updateZoomLabel();
    applyZoom();
  });
  updateZoomLabel();

  window.addEventListener("resize", () => {
    drawAll();
  });

  // 색상/모양 선택 팝업 (거점)
  const colorPicker       = document.getElementById("color-picker");
  const cpColorsContainer = document.getElementById("color-picker-colors");
  const shapeButtons      = document.querySelectorAll(".shape-option");
  const colorPickerCancel = document.getElementById("color-picker-cancel");

  const colorList = [
    "#e53935","#fb8c00","#fdd835","#43a047","#1e88e5",
    "#8e24aa","#00acc1","#d81b60","#3949ab","#5e35b1",
    "#f06292","#26c6da","#81c784","#cddc39","#ffb300",
    "#6d4c41","#546e7a","#9e9d24","#ff7043","#ffffff"
  ];

  let popupShape = "circle";
  let colorPickerCallback = null;

  function buildColorChoices() {
    cpColorsContainer.innerHTML = "";
    colorList.forEach(c => {
      const div = document.createElement("div");
      div.className = "cp-color";
      div.style.background = c;
      div.dataset.color = c;
      cpColorsContainer.appendChild(div);
    });
  }
  buildColorChoices();

  shapeButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      shapeButtons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      popupShape = btn.dataset.shape;
    });
  });

  function openColorShapePicker(callback) {
    colorPickerCallback = callback;
    colorPicker.style.display = "flex";
  }

  cpColorsContainer.addEventListener("click", e => {
    const target = e.target;
    if (!target.classList.contains("cp-color")) return;
    const color = target.dataset.color;
    if (!colorPickerCallback) return;
    const cb = colorPickerCallback;
    colorPickerCallback = null;
    colorPicker.style.display = "none";
    cb(color, popupShape);
  });

  colorPickerCancel.addEventListener("click", () => {
    colorPicker.style.display = "none";
    colorPickerCallback = null;
  });

  // 화살표 색 선택 팝업
  const arrowColorPicker   = document.getElementById("arrow-color-picker");
  const arrowColorButtons  = document.querySelectorAll(".arrow-color-btn");
  const arrowColorCancel   = document.getElementById("arrow-color-cancel");
  let arrowColorCallback   = null;

  function openArrowColorPicker(callback) {
    arrowColorCallback = callback;
    arrowColorPicker.style.display = "flex";
  }

  arrowColorButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      if (!arrowColorCallback) return;
      const color = btn.dataset.color;
      const cb = arrowColorCallback;
      arrowColorCallback = null;
      arrowColorPicker.style.display = "none";
      cb(color);
    });
  });

  arrowColorCancel.addEventListener("click", () => {
    arrowColorPicker.style.display = "none";
    arrowColorCallback = null;
  });

  // 깃발 색 선택 팝업
  const flagColorPicker  = document.getElementById("flag-color-picker");
  const flagColorButtons = document.querySelectorAll(".flag-color-btn");
  const flagColorCancel  = document.getElementById("flag-color-cancel");
  const addFlagBtn       = document.getElementById("add-flag-btn");

  let flagAdding   = false;
  let flagAddColor = "#ff1744";
  let flagMoveId   = null;      // 메뉴에서 위치변경(지도 클릭)용
  let draggingNodeId = null;    // 롱프레스 드래그용
  let draggingFlagId = null;    // 롱프레스 드래그용

  addFlagBtn.addEventListener("click", () => {
    flagColorPicker.style.display = "flex";
  });

  flagColorButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      flagAddColor = btn.dataset.color;
      flagColorPicker.style.display = "none";
      flagAdding = true;
      alert("지도의 원하는 위치를 클릭해서 깃발을 추가하세요.");
    });
  });

  flagColorCancel.addEventListener("click", () => {
    flagColorPicker.style.display = "none";
    flagAdding = false;
  });

  // 좌표 변환
  function getRelativePos(clientX, clientY) {
    const rect = mapImage.getBoundingClientRect();
    const x = (clientX - rect.left) / rect.width;
    const y = (clientY - rect.top)  / rect.height;
    return { x, y };
  }

  function toScreenPos(node) {
    const rect = mapImage.getBoundingClientRect();
    return {
      x: node.x * rect.width,
      y: node.y * rect.height
    };
  }

  // DB 동기화
  nodesRef.on("value", snap => {
    nodes = snap.val() || {};
    drawAll();
  });
  linksRef.on("value", snap => {
    links = snap.val() || {};
    drawAll();
  });
  flagsRef.on("value", snap => {
    flags = snap.val() || {};
    drawAll();
  });

  // 화살표 출발 노드
  let arrowStartNodeId = null;

  // 기존 메뉴 제거
  function closeNodeMenu() {
    const m = document.getElementById("node-menu");
    if (m) m.remove();
  }

  // 지도 클릭: 깃발 추가 / 화살표 취소 / 새 거점 / (깃발 메뉴에서 위치변경)
  mapContainer.addEventListener("click", e => {
    const pos = getRelativePos(e.clientX, e.clientY);

    // 1) 깃발 이동 모드 (메뉴에서 '위치변경(지도 클릭)' 선택한 경우)
    if (flagMoveId) {
      flagsRef.child(flagMoveId).update({ x: pos.x, y: pos.y });
      flagMoveId = null;
      alert("깃발 위치가 변경되었습니다.");
      return;
    }

    // 2) 깃발 추가 모드
    if (flagAdding) {
      flagsRef.push({
        x: pos.x,
        y: pos.y,
        color: flagAddColor
      });
      flagAdding = false;
      return;
    }

    // 3) 화살표 모드 취소
    if (arrowStartNodeId) {
      arrowStartNodeId = null;
      alert("화살표 시작이 취소되었습니다.");
      return;
    }

    // 4) 새 거점 추가
    openColorShapePicker((color, shape) => {
      const name = (prompt("새 거점 이름을 입력하세요:") || "").trim();
      if (!name) return;
      nodesRef.push({
        x: pos.x,
        y: pos.y,
        color,
        shape,
        name
      });
    });
  });

  // 드래그로 세부 조정 (거점/깃발 공통)
  function updateDragPosition(clientX, clientY) {
    const pos = getRelativePos(clientX, clientY);
    if (draggingNodeId) {
      nodesRef.child(draggingNodeId).update({ x: pos.x, y: pos.y });
    }
    if (draggingFlagId) {
      flagsRef.child(draggingFlagId).update({ x: pos.x, y: pos.y });
    }
  }

  window.addEventListener("mousemove", e => {
    if (draggingNodeId || draggingFlagId) {
      e.preventDefault();
      updateDragPosition(e.clientX, e.clientY);
    }
  });

  window.addEventListener("touchmove", e => {
    if (draggingNodeId || draggingFlagId) {
      e.preventDefault();
      const t = e.touches[0];
      if (t) updateDragPosition(t.clientX, t.clientY);
    }
  }, { passive: false });

  function endDrag() {
    draggingNodeId = null;
    draggingFlagId = null;
  }

  window.addEventListener("mouseup", endDrag);
  window.addEventListener("touchend", endDrag);
  window.addEventListener("touchcancel", endDrag);

  // 전체 그리기 (화살표 + 거점 + 깃발)
  function drawAll() {
    const rect = mapImage.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;

    overlay.setAttribute("width", rect.width);
    overlay.setAttribute("height", rect.height);
    overlay.innerHTML = "";

    // defs 및 색별 marker 캐시
    const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
    overlay.appendChild(defs);
    const markerMap = {}; // color -> markerId

    // 화살표
    Object.entries(links || {}).forEach(([id, link]) => {
      const fromNode = nodes[link.from];
      const toNode   = nodes[link.to];
      if (!fromNode || !toNode) return;

      const p1 = toScreenPos(fromNode);
      const p2 = toScreenPos(toNode);

      let x1 = p1.x;
      let y1 = p1.y;
      let x2 = p2.x;
      let y2 = p2.y;

      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.sqrt(dx*dx + dy*dy) || 1;

      // 양쪽에서 살짝 안으로 줄이기
      const offsetStart = 4;
      const offsetEnd   = 8;
      x1 += (dx / len) * offsetStart;
      y1 += (dy / len) * offsetStart;
      x2 -= (dx / len) * offsetEnd;
      y2 -= (dy / len) * offsetEnd;

      const color = link.color || fromNode.color || "#ffffff";

      // 색마다 marker 하나씩 생성해서 머리색도 동일
      let markerId = markerMap[color];
      if (!markerId) {
        markerId = "arrow-head-" + color.replace("#","");
        const marker = document.createElementNS("http://www.w3.org/2000/svg", "marker");
        marker.setAttribute("id", markerId);
        marker.setAttribute("markerWidth", "5");
        marker.setAttribute("markerHeight", "5");
        marker.setAttribute("refX", "4");
        marker.setAttribute("refY", "2.5");
        marker.setAttribute("orient", "auto");
        marker.setAttribute("markerUnits", "strokeWidth");
        const mp = document.createElementNS("http://www.w3.org/2000/svg", "path");
        mp.setAttribute("d", "M0,0 L4,2.5 L0,5 z");
        mp.setAttribute("fill", color);
        marker.appendChild(mp);
        defs.appendChild(marker);
        markerMap[color] = markerId;
      }

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", `M ${x1} ${y1} L ${x2} ${y2}`);
      path.setAttribute("stroke", color);
      path.setAttribute("stroke-width", "2");
      path.setAttribute("fill", "none");
      path.setAttribute("class", "link-blink");
      path.setAttribute("marker-end", "url(#" + markerId + ")");
      path.style.pointerEvents = "auto";

      path.addEventListener("click", ev => {
        ev.stopPropagation();
        if (!confirm("이 화살표를 삭제할까요?")) return;
        linksRef.child(id).remove();
        closeNodeMenu();
      });

      overlay.appendChild(path);
    });

    // 거점
    Object.entries(nodes || {}).forEach(([id, node]) => {
      const p = toScreenPos(node);
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.style.pointerEvents = "auto";

      const shape = node.shape || "circle";
      let symbolEl;

      if (shape === "circle") {
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", p.x);
        c.setAttribute("cy", p.y);
        c.setAttribute("r", 5);
        c.setAttribute("fill", node.color || "#ffffff");
        symbolEl = c;
      } else {
        const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
        t.setAttribute("x", p.x - 6);
        t.setAttribute("y", p.y + 4);
        t.setAttribute("font-size", "12");
        t.setAttribute("fill", node.color || "#ffffff");
        t.textContent = (shape === "sun") ? "☀" : "🌙";
        symbolEl = t;
      }
      g.appendChild(symbolEl);

      const name = node.name || "";
      if (name) {
        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        label.setAttribute("x", p.x);
        label.setAttribute("y", p.y + 10);
        label.setAttribute("class", "node-label");
        label.textContent = name;
        g.appendChild(label);
        overlay.appendChild(g);

        const bbox = label.getBBox();
        const padX = 3;
        const padY = 1;
        const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        bg.setAttribute("x", bbox.x - padX);
        bg.setAttribute("y", bbox.y - padY);
        bg.setAttribute("width", bbox.width + padX * 2);
        bg.setAttribute("height", bbox.height + padY * 2);
        bg.setAttribute("fill", "rgba(0,0,0,0.75)");
        bg.setAttribute("rx", "3");
        bg.setAttribute("ry", "3");

        g.removeChild(label);
        g.insertBefore(bg, g.firstChild.nextSibling);
        g.appendChild(label);
      } else {
        overlay.appendChild(g);
      }

      // 🔹 거점 롱프레스 → 드래그로 위치 세부 조정
      let nodeLongPressTimer = null;
      let nodeLongPressed    = false;

      const startNodeLongPress = (ev) => {
        nodeLongPressed = false;
        nodeLongPressTimer = setTimeout(() => {
          nodeLongPressed = true;
          draggingNodeId = id;   // 드래그 모드 진입
        }, 600);
      };
      const cancelNodeLongPress = () => {
        if (nodeLongPressTimer) {
          clearTimeout(nodeLongPressTimer);
          nodeLongPressTimer = null;
        }
      };

      g.addEventListener("mousedown", startNodeLongPress);
      g.addEventListener("touchstart", (ev) => {
        ev.preventDefault();
        startNodeLongPress(ev);
      }, { passive: false });
      g.addEventListener("mouseup", cancelNodeLongPress);
      g.addEventListener("mouseleave", cancelNodeLongPress);
      g.addEventListener("touchend", cancelNodeLongPress);
      g.addEventListener("touchcancel", cancelNodeLongPress);

      // 노드 클릭 이벤트 (거점 메뉴 + 화살표 연결)
      g.addEventListener("click", ev => {
        ev.stopPropagation();
        if (nodeLongPressed) {
          nodeLongPressed = false;
          return; // 롱프레스 후의 클릭은 메뉴 열지 않음
        }

        // 화살표 출발 노드가 이미 선택되어 있고, 다른 노드를 클릭한 경우 → 화살표 생성
        if (arrowStartNodeId && arrowStartNodeId !== id) {
          openArrowColorPicker(color => {
            if (!color) {
              arrowStartNodeId = null;
              return;
            }
            linksRef.push({
              from: arrowStartNodeId,
              to: id,
              color
            });
            arrowStartNodeId = null;
            alert("화살표가 생성되었습니다.");
            closeNodeMenu();
          });
          return;
        }

        // 같은 노드를 다시 클릭 → 화살표 모드 취소
        if (arrowStartNodeId && arrowStartNodeId === id) {
          arrowStartNodeId = null;
          alert("화살표 시작이 취소되었습니다.");
          closeNodeMenu();
          return;
        }

        // 거점 메뉴 띄우기
        closeNodeMenu();
        const menu = document.createElement("div");
        menu.id = "node-menu";

        const clickX = ev.clientX;
        const clickY = ev.clientY;
        const menuWidth = 190;
        const menuHeight = 160;

        let left = clickX + 8;
        let top  = clickY + 8;
        if (left + menuWidth > window.innerWidth - 8) {
          left = window.innerWidth - menuWidth - 8;
        }
        if (top + menuHeight > window.innerHeight - 8) {
          top = window.innerHeight - menuHeight - 8;
        }
        menu.style.left = left + "px";
        menu.style.top  = top  + "px";

        const title = document.createElement("div");
        title.id = "node-menu-title";
        title.textContent = node.name ? `거점: ${node.name}` : "거점 메뉴";
        menu.appendChild(title);

        // 버튼 1: 색/모양 변경
        const btnColor = document.createElement("button");
        btnColor.className = "node-menu-btn";
        btnColor.innerHTML =
          `<span class="node-menu-icon">🎨</span><span>색 / 모양 변경</span>`;
        btnColor.addEventListener("click", () => {
          closeNodeMenu();
          openColorShapePicker((color, shapeSel) => {
            const newName = (prompt("거점 이름 (변경 안하면 그대로):", node.name || "") || "").trim();
            const updates = { color };
            updates.shape = shapeSel || node.shape || "circle";
            if (newName) updates.name = newName;
            nodesRef.child(id).update(updates);
          });
        });
        menu.appendChild(btnColor);

        // 버튼 2: 여기서 출발 화살표 삭제
        const btnDelOutgoing = document.createElement("button");
        btnDelOutgoing.className = "node-menu-btn";
        btnDelOutgoing.innerHTML =
          `<span class="node-menu-icon">🚫</span><span>여기서 출발 화살표 삭제</span>`;
        btnDelOutgoing.addEventListener("click", () => {
          closeNodeMenu();
          if (!confirm("이 거점에서 출발하는 모든 화살표를 삭제할까요?")) return;
          Object.entries(links || {}).forEach(([lid, l]) => {
            if (l.from === id) {
              linksRef.child(lid).remove();
            }
          });
        });
        menu.appendChild(btnDelOutgoing);

        // 버튼 3: 거점 삭제
        const btnDelete = document.createElement("button");
        btnDelete.className = "node-menu-btn";
        btnDelete.innerHTML =
          `<span class="node-menu-icon">🗑</span><span>거점 삭제</span>`;
        btnDelete.addEventListener("click", () => {
          closeNodeMenu();
          if (!confirm("이 거점을 삭제할까요? (연결된 화살표도 삭제됨)")) return;
          Object.entries(links || {}).forEach(([lid, l]) => {
            if (l.from === id || l.to === id) {
              linksRef.child(lid).remove();
            }
          });
          nodesRef.child(id).remove();
        });
        menu.appendChild(btnDelete);

        // 버튼 4: 화살표 연결 시작
        const btnArrow = document.createElement("button");
        btnArrow.className = "node-menu-btn";
        btnArrow.innerHTML =
          `<span class="node-menu-icon">➡</span><span>화살표 연결 시작</span>`;
        btnArrow.addEventListener("click", () => {
          closeNodeMenu();
          arrowStartNodeId = id;
          alert("이 거점에서 출발하는 화살표 모드입니다. 도착 거점을 클릭하세요.");
        });
        menu.appendChild(btnArrow);

        document.body.appendChild(menu);

        // 바깥 클릭 시 메뉴 닫기
        const closeHandler = evt => {
          if (!menu.contains(evt.target)) {
            closeNodeMenu();
            document.removeEventListener("click", closeHandler);
          }
        };
        setTimeout(() => {
          document.addEventListener("click", closeHandler);
        }, 0);
      });
    });

    // 🔹 깃발 (거점보다 크게)
    Object.entries(flags || {}).forEach(([id, flag]) => {
      const pos = toScreenPos(flag);
      const color = flag.color || "#ff1744";

      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.style.pointerEvents = "auto";

      // 깃대
      const pole = document.createElementNS("http://www.w3.org/2000/svg", "line");
      pole.setAttribute("x1", pos.x);
      pole.setAttribute("y1", pos.y - 18);
      pole.setAttribute("x2", pos.x);
      pole.setAttribute("y2", pos.y + 6);
      pole.setAttribute("stroke", "#f5f5f5");
      pole.setAttribute("stroke-width", "2");
      g.appendChild(pole);

      // 깃발(삼각형)
      const flagShape = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
      const p1x = pos.x;
      const p1y = pos.y - 18;
      const p2x = pos.x + 14;
      const p2y = pos.y - 12;
      const p3x = pos.x;
      const p3y = pos.y - 6;
      flagShape.setAttribute("points", `${p1x},${p1y} ${p2x},${p2y} ${p3x},${p3y}`);
      flagShape.setAttribute("fill", color);
      flagShape.setAttribute("stroke", "#000");
      flagShape.setAttribute("stroke-width", "1");
      g.appendChild(flagShape);

      // 🔹 깃발 롱프레스 → 드래그로 위치 세부 조정
      let flagLongPressTimer = null;
      let flagLongPressed    = false;

      const startFlagLongPress = (ev) => {
        flagLongPressed = false;
        flagLongPressTimer = setTimeout(() => {
          flagLongPressed = true;
          draggingFlagId = id;   // 드래그 모드 진입
        }, 600);
      };
      const cancelFlagLongPress = () => {
        if (flagLongPressTimer) {
          clearTimeout(flagLongPressTimer);
          flagLongPressTimer = null;
        }
      };

      g.addEventListener("mousedown", startFlagLongPress);
      g.addEventListener("touchstart", (ev) => {
        ev.preventDefault();
        startFlagLongPress(ev);
      }, { passive: false });
      g.addEventListener("mouseup", cancelFlagLongPress);
      g.addEventListener("mouseleave", cancelFlagLongPress);
      g.addEventListener("touchend", cancelFlagLongPress);
      g.addEventListener("touchcancel", cancelFlagLongPress);

      g.addEventListener("click", ev => {
        ev.stopPropagation();
        if (flagLongPressed) {
          flagLongPressed = false;
          return; // 롱프레스 후 클릭은 메뉴 열지 않음
        }

        // 깃발 메뉴 (node-menu 재사용)
        closeNodeMenu();
        const menu = document.createElement("div");
        menu.id = "node-menu";

        const clickX = ev.clientX;
        const clickY = ev.clientY;
        const menuWidth = 190;
        const menuHeight = 110;

        let left = clickX + 8;
        let top  = clickY + 8;
        if (left + menuWidth > window.innerWidth - 8) {
          left = window.innerWidth - menuWidth - 8;
        }
        if (top + menuHeight > window.innerHeight - 8) {
          top = window.innerHeight - menuHeight - 8;
        }
        menu.style.left = left + "px";
        menu.style.top  = top  + "px";

        const title = document.createElement("div");
        title.id = "node-menu-title";
        title.textContent = "깃발 메뉴";
        menu.appendChild(title);

        // 위치변경 (클릭 방식 그대로 유지)
        const btnMove = document.createElement("button");
        btnMove.className = "node-menu-btn";
        btnMove.innerHTML =
          `<span class="node-menu-icon">📍</span><span>위치변경 (지도 클릭)</span>`;
        btnMove.addEventListener("click", () => {
          closeNodeMenu();
          flagMoveId = id;
          alert("새 위치를 클릭해서 깃발을 옮겨주세요.");
        });
        menu.appendChild(btnMove);

        // 선택 깃발 삭제
        const btnDel = document.createElement("button");
        btnDel.className = "node-menu-btn";
        btnDel.innerHTML =
          `<span class="node-menu-icon">🗑</span><span>선택깃발 삭제</span>`;
        btnDel.addEventListener("click", () => {
          closeNodeMenu();
          if (!confirm("이 깃발을 삭제할까요?")) return;
          flagsRef.child(id).remove();
        });
        menu.appendChild(btnDel);

        document.body.appendChild(menu);

        const closeHandler = evt => {
          if (!menu.contains(evt.target)) {
            closeNodeMenu();
            document.removeEventListener("click", closeHandler);
          }
        };
        setTimeout(() => {
          document.addEventListener("click", closeHandler);
        }, 0);
      });

      overlay.appendChild(g);
    });
  }

  // 이미지 로딩 후 최초 드로우
  if (mapImage.complete) {
    applyZoom();
  } else {
    mapImage.onload = () => {
      applyZoom();
    };
  }

  // ===== 거점 검색 기능 =====
  const nodeSearchInput = document.getElementById("node-search-input");
  const nodeSearchBtn   = document.getElementById("node-search-btn");

  // 🔍 거점 검색 + 형광 화살표 강조
  function focusNodeByName(query) {
    if (!query) return;
    const q = query.trim();
    if (!q) return;

    let foundNode = null;
    Object.values(nodes || {}).some(node => {
      if (node.name && node.name.includes(q)) {
        foundNode = node;
        return true;
      }
      return false;
    });

    if (!foundNode) {
      alert("해당 이름을 포함한 거점을 찾을 수 없습니다.");
      return;
    }

    // 지도 이동
    const rect = mapImage.getBoundingClientRect();
    const imgWidth  = rect.width;
    const imgHeight = rect.height;
    const targetX = foundNode.x * imgWidth;
    const targetY = foundNode.y * imgHeight;
    const cw = mapContainer.clientWidth;
    const ch = mapContainer.clientHeight;
    mapContainer.scrollLeft = Math.max(0, targetX - cw / 2);
    mapContainer.scrollTop  = Math.max(0, targetY - ch / 2);

    // 🔹 검색된 거점 위에 형광색 ↓ 화살표 표시
    const p = toScreenPos(foundNode);
    const arrow = document.createElementNS("http://www.w3.org/2000/svg", "text");
    arrow.setAttribute("x", p.x);
    arrow.setAttribute("y", p.y - 20);  // 거점 살짝 위
    arrow.setAttribute("text-anchor", "middle");
    arrow.setAttribute("fill", "#00ff99");
    arrow.setAttribute("font-size", "30");
    arrow.textContent = "↓";
    arrow.style.animation = "blink 1s infinite";

    overlay.appendChild(arrow);

    // 10초 후 자동 제거
    setTimeout(() => arrow.remove(), 10000);
  }

  nodeSearchBtn.addEventListener("click", () => {
    focusNodeByName(nodeSearchInput.value);
  });
  nodeSearchInput.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      e.preventDefault();
      focusNodeByName(nodeSearchInput.value);
    }
  });
</script>
</body>
</html>
