<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>전략 지도 보드</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0c0c0c;
      color: #f5f5f5;
    }

    /* 전체 레이아웃 */
    .app {
      display: flex;
      flex-direction: row;
      height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      background: #111;
    }

    #main-column {
      flex: 3;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #side-panel {
      flex: 1.2;
      border-left: 1px solid #333;
      background: #111;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-size: 13px;
      min-width: 230px;
    }

    .side-box {
      background: #141414;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 8px 10px;
    }

    .side-title {
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    #online-list {
      max-height: 80px;
      overflow-y: auto;
      font-size: 12px;
      color: #ccc;
    }

    #online-list.empty {
      color: #666;
      font-style: italic;
    }

    #teams-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .team-block {
      border-radius: 8px;
      border: 1px solid #333;
      padding: 6px 7px;
      background: #171717;
    }

    .team-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 4px;
    }

    .team-label {
      font-size: 11px;
      color: #888;
      width: 36px;
      flex-shrink: 0;
    }

    .team-name {
      flex: 1;
      border-radius: 6px;
      border: 1px solid #333;
      background: #181818;
      color: #f5f5f5;
      padding: 4px 6px;
      font-size: 13px;
      outline: none;
    }

    .team-members {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      min-height: 20px;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .team-members.empty-members {
      color: #555;
      font-style: italic;
    }

    .team-member-pill {
      padding: 2px 6px;
      border-radius: 999px;
      background: #222;
      border: 1px solid #444;
      cursor: pointer;
      white-space: nowrap;
    }

    .team-member-pill:hover {
      background: #333;
    }

    .team-add-btn {
      border-radius: 999px;
      border: 1px solid #444;
      background: #202020;
      color: #f5f5f5;
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
    }

    #pungun-link-btn {
      border-radius: 999px;
      border: 1px solid #444;
      background: #222;
      color: #ffda6b;
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
    }

    #map-container {
      position: relative;
      width: 100%;
      flex: 0 0 55vh;
      max-height: 60vh;
      background: #000;
      overflow: hidden;
    }

    #map-inner {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center center;
      cursor: grab;
    }

    #map-inner.dragging {
      cursor: grabbing;
    }

    #map-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    #draw-canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #zoom-controls {
      position: absolute;
      right: 10px;
      top: 10px;
      display: flex;
      gap: 4px;
      background: rgba(0,0,0,0.5);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid #444;
      z-index: 10;
    }

    .zoom-btn {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid #555;
      background: #222;
      color: #f5f5f5;
      font-size: 16px;
      cursor: pointer;
    }

    #tools {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #181818;
      border-bottom: 1px solid #333;
    }
    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #444;
      cursor: pointer;
    }
    .color-btn.active {
      border-color: #fff;
      box-shadow: 0 0 6px rgba(255,255,255,0.6);
    }
    .clear-group {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .clear-btn {
      border: 1px solid #444;
      background: #222;
      color: #f5f5f5;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    #chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #101010;
    }
    #nickname-bar {
      padding: 6px 10px;
      font-size: 12px;
      background: #181818;
      border-bottom: 1px solid #333;
      color: #aaa;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #chat-clear-btn {
      border-radius: 999px;
      border: 1px solid #444;
      padding: 3px 10px;
      font-size: 12px;
      background: #222;
      color: #f5f5f5;
      cursor: pointer;
    }
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      font-size: 14px;
    }
    .chat-msg {
      margin-bottom: 4px;
      word-wrap: break-word;
    }
    .chat-nick {
      font-weight: 600;
      margin-right: 4px;
      color: #ffcc66;
    }
    .chat-time {
      font-size: 11px;
      color: #777;
      margin-left: 4px;
    }
    #chat-form {
      display: flex;
      border-top: 1px solid #333;
      padding: 6px 8px;
      gap: 6px;
    }
    #chat-input {
      flex: 1;
      border-radius: 999px;
      border: 1px solid #333;
      padding: 8px 12px;
      font-size: 14px;
      background: #181818;
      color: #f5f5f5;
      outline: none;
    }
    #chat-send {
      border-radius: 999px;
      border: none;
      padding: 0 14px;
      font-size: 14px;
      background: #3f8cff;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="app">
  <!-- 왼쪽 -->
  <div id="main-column">
    <!-- 지도 + 드로잉 -->
    <div id="map-container">
      <div id="map-inner">
        <img id="map-image" src="map.jpg" alt="지도">
        <canvas id="draw-canvas"></canvas>
      </div>
      <div id="zoom-controls">
        <button class="zoom-btn" data-zoom="out">−</button>
        <button class="zoom-btn" data-zoom="in">+</button>
      </div>
    </div>

    <!-- 색 선택 -->
    <div id="tools">
      <span>색 선택:</span>
      <div id="color-palette">
        <button class="color-btn" data-color="red" style="background:#e53935"></button>
        <button class="color-btn" data-color="orange" style="background:#fb8c00"></button>
        <button class="color-btn" data-color="yellow" style="background:#fdd835"></button>
        <button class="color-btn" data-color="green" style="background:#43a047"></button>
        <button class="color-btn" data-color="blue" style="background:#1e88e5"></button>
        <button class="color-btn" data-color="white" style="background:#fff"></button>
        <button class="color-btn" data-color="black" style="background:#000"></button>
      </div>

      <div class="clear-group">
        <button class="clear-btn" data-clear="red">빨 초기화</button>
        <button class="clear-btn" data-clear="orange">주 초기화</button>
        <button class="clear-btn" data-clear="yellow">노 초기화</button>
        <button class="clear-btn" data-clear="green">초 초기화</button>
        <button class="clear-btn" data-clear="blue">파 초기화</button>
        <button class="clear-btn" data-clear="black">검 초기화</button>
        <button class="clear-btn" data-clear="white">흰 초기화🔒</button>
      </div>
    </div>

    <!-- 채팅 -->
    <div id="chat">
      <div id="nickname-bar">
        <span id="nickname-label"></span>
        <button id="chat-clear-btn">채팅 초기화</button>
      </div>
      <div id="chat-messages"></div>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="메시지 입력..." autocomplete="off">
        <button id="chat-send" type="submit">전송</button>
      </form>
    </div>
  </div>

  <!-- 오른쪽: 접속자 + 팀 -->
  <div id="side-panel">
    <div class="side-box">
      <div class="side-title">
        <span>접속자 <span id="online-count">0</span>명</span>
      </div>
      <div id="online-list" class="empty">접속자 없음</div>
    </div>

    <div class="side-box">
      <div class="side-title">
        <span>팀 짜기</span>
        <button id="pungun-link-btn">-풍운 병력확인-</button>
      </div>
      <div id="teams-list">
        <!-- 팀 1~6 -->
        <div class="team-block" data-team="team1">
          <div class="team-row">
            <span class="team-label">팀1</span>
            <input class="team-name" data-team="team1" value="팀1">
          </div>
          <div class="team-members" data-team-members="team1">팀원 없음</div>
          <button class="team-add-btn" data-team="team1">+ 팀원추가</button>
        </div>
        <div class="team-block" data-team="team2">
          <div class="team-row">
            <span class="team-label">팀2</span>
            <input class="team-name" data-team="team2" value="팀2">
          </div>
          <div class="team-members" data-team-members="team2">팀원 없음</div>
          <button class="team-add-btn" data-team="team2">+ 팀원추가</button>
        </div>

        <div class="team-block" data-team="team3">
          <div class="team-row">
            <span class="team-label">팀3</span>
            <input class="team-name" data-team="team3" value="팀3">
          </div>
          <div class="team-members" data-team-members="team3">팀원 없음</div>
          <button class="team-add-btn" data-team="team3">+ 팀원추가</button>
        </div>

        <div class="team-block" data-team="team4">
          <div class="team-row">
            <span class="team-label">팀4</span>
            <input class="team-name" data-team="team4" value="팀4">
          </div>
          <div class="team-members" data-team-members="team4">팀원 없음</div>
          <button class="team-add-btn" data-team="team4">+ 팀원추가</button>
        </div>

        <div class="team-block" data-team="team5">
          <div class="team-row">
            <span class="team-label">팀5</span>
            <input class="team-name" data-team="team5" value="팀5">
          </div>
          <div class="team-members" data-team-members="team5">팀원 없음</div>
          <button class="team-add-btn" data-team="team5">+ 팀원추가</button>
        </div>

        <div class="team-block" data-team="team6">
          <div class="team-row">
            <span class="team-label">팀6</span>
            <input class="team-name" data-team="team6" value="팀6">
          </div>
          <div class="team-members" data-team-members="team6">팀원 없음</div>
          <button class="team-add-btn" data-team="team6">+ 팀원추가</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>

<script>
  // 🔹 Firebase 설정 (너의 콘솔 그대로)
  const firebaseConfig = {
     apiKey: "AIzaSyCLoTe7mwaCbZwdfWboOwai2-CyKX-Pjx8",
  authDomain: "fir-console-90c30.firebaseapp.com",
  databaseURL: "https://fir-console-90c30-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "fir-console-90c30",
  storageBucket: "fir-console-90c30.firebasestorage.app",
  messagingSenderId: "476568239405",
  appId: "1:476568239405:web:6b779644d4e0c1b39827a4",
  measurementId: "G-KE0TQV1XRJ"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const drawingsRef = db.ref("drawings");
  const chatRef = db.ref("chat");
  const teamsRef = db.ref("teams");
  const presenceRef = db.ref("presence");
  const connectedRef = db.ref(".info/connected");

  // 닉네임 저장
  let nickname = localStorage.getItem("nickname") || "";
  if (!nickname) {
    nickname = prompt("닉네임을 입력하세요") || "손님" + Math.floor(Math.random() * 1000);
    localStorage.setItem("nickname", nickname);
  }
  document.getElementById("nickname-label").textContent = "현재 닉네임: " + nickname;

  // 지도 관련 요소
  const mapInner = document.getElementById("map-inner");
  const canvas = document.getElementById("draw-canvas");
  const ctx = canvas.getContext("2d");
  let drawingData = {};

  // 🔹 지도 확대/축소 + 드래그 이동
  let zoom = 1, minZoom = 0.6, maxZoom = 2.5, zoomStep = 0.2;
  let isDraggingMap = false;
  let mapX = 0, mapY = 0, startX = 0, startY = 0;

  function updateMapTransform() {
    mapInner.style.transform = `translate(calc(-50% + ${mapX}px), calc(-50% + ${mapY}px)) scale(${zoom})`;
  }

  // 마우스 드래그
  mapInner.addEventListener("mousedown", e => {
    if (e.target.id === "draw-canvas") return;
    isDraggingMap = true;
    startX = e.clientX;
    startY = e.clientY;
    mapInner.classList.add("dragging");
  });
  window.addEventListener("mouseup", () => {
    isDraggingMap = false;
    mapInner.classList.remove("dragging");
  });
  window.addEventListener("mousemove", e => {
    if (!isDraggingMap) return;
    mapX += (e.clientX - startX);
    mapY += (e.clientY - startY);
    startX = e.clientX;
    startY = e.clientY;
    updateMapTransform();
  });

  // 터치 이동 (모바일)
  let touchStart = null;
  mapInner.addEventListener("touchstart", e => {
    if (e.touches.length === 1) {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
  });
  mapInner.addEventListener("touchmove", e => {
    if (e.touches.length === 1 && touchStart) {
      const dx = e.touches[0].clientX - touchStart.x;
      const dy = e.touches[0].clientY - touchStart.y;
      mapX += dx;
      mapY += dy;
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      updateMapTransform();
    }
  });
  mapInner.addEventListener("touchend", () => { touchStart = null; });

  // 줌 버튼
  document.querySelectorAll(".zoom-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      if (btn.dataset.zoom === "in") zoom = Math.min(zoom + zoomStep, maxZoom);
      else zoom = Math.max(zoom - zoomStep, minZoom);
      updateMapTransform();
    });
  });
  // 휠 줌
  document.getElementById("map-container").addEventListener("wheel", e => {
    e.preventDefault();
    if (e.deltaY < 0) zoom = Math.min(zoom + zoomStep, maxZoom);
    else zoom = Math.max(zoom - zoomStep, minZoom);
    updateMapTransform();
  }, { passive: false });
  /* ===== 색상 설정 ===== */
  const colorMap = {
    red: "#e53935",
    orange: "#fb8c00",
    yellow: "#fdd835",
    green: "#43a047",
    blue: "#1e88e5",
    white: "#ffffff",
    black: "#000000"
  };
  let currentColor = "red";
  const colorButtons = document.querySelectorAll(".color-btn");
  colorButtons.forEach(b => {
    b.addEventListener("click", () => {
      currentColor = b.dataset.color;
      colorButtons.forEach(x => x.classList.toggle("active", x === b));
    });
  });

  /* ===== 그림 그리기 ===== */
  const drawingsRef = db.ref("drawings");
  drawingsRef.on("value", snap => {
    drawingData = snap.val() || {};
    redrawAll();
  });

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    redrawAll();
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  function redrawAll() {
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    Object.keys(drawingData).forEach(color => {
      ctx.strokeStyle = colorMap[color] || "#fff";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      Object.values(drawingData[color]).forEach(seg => {
        ctx.beginPath();
        ctx.moveTo(seg.x1 * w, seg.y1 * h);
        ctx.lineTo(seg.x2 * w, seg.y2 * h);
        ctx.stroke();
      });
    });
  }

  let isDrawing = false, last = {};
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return { x: x / r.width, y: y / r.height };
  }
  function start(e){ isDrawing=true; last=pos(e); e.preventDefault();}
  function move(e){
    if(!isDrawing)return;
    const p=pos(e);
    db.ref("drawings/"+currentColor).push({x1:last.x,y1:last.y,x2:p.x,y2:p.y});
    last=p; e.preventDefault();
  }
  function stop(){isDrawing=false;}

  canvas.addEventListener("mousedown",start);
  canvas.addEventListener("mousemove",move);
  window.addEventListener("mouseup",stop);
  canvas.addEventListener("touchstart",start,{passive:false});
  canvas.addEventListener("touchmove",move,{passive:false});
  window.addEventListener("touchend",stop);

  /* ===== 색 초기화 ===== */
  document.querySelectorAll(".clear-btn").forEach(btn=>{
    btn.onclick=()=>{
      const c=btn.dataset.clear;
      if(c==="white"){
        const pw=prompt("흰색 초기화 비밀번호:");
        if(pw!=="1234")return alert("비밀번호 오류");
      }
      db.ref("drawings/"+c).remove();
    };
  });

  /* ===== 채팅 ===== */
  const chatRef = db.ref("chat");
  const chatBox = document.getElementById("chat-messages");
  chatRef.on("value",s=>{
    chatBox.innerHTML="";
    s.forEach(v=>addChat(v.val()));
  });
  function addChat(d){
    const div=document.createElement("div");
    div.className="chat-msg";
    div.innerHTML=`<span class="chat-nick">${d.nick}</span>${d.text}<span class="chat-time">${new Date(d.time||Date.now()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>`;
    chatBox.appendChild(div);
    chatBox.scrollTop=chatBox.scrollHeight;
  }
  document.getElementById("chat-form").onsubmit=e=>{
    e.preventDefault();
    const val=document.getElementById("chat-input").value.trim();
    if(!val)return;
    chatRef.push({nick:nickname,text:val,time:Date.now()});
    document.getElementById("chat-input").value="";
  };
  document.getElementById("chat-clear-btn").onclick=()=>{
    const pw=prompt("채팅 초기화 비밀번호:");
    if(pw==="1234")chatRef.remove();
  };

  /* ===== 팀 관리 ===== */
  const teamsRef = db.ref("teams");
  function renderTeams(d){
    document.querySelectorAll(".team-block").forEach(b=>{
      const key=b.dataset.team;
      const nameInput=b.querySelector(".team-name");
      const list=b.querySelector(".team-members");
      const team=d[key]||{name:key,members:{}};
      nameInput.value=team.name;
      const mems=team.members||{};
      list.innerHTML="";
      const keys=Object.keys(mems);
      if(keys.length===0)list.textContent="팀원 없음";
      keys.forEach(id=>{
        const pill=document.createElement("span");
        pill.className="team-member-pill";
        pill.textContent=mems[id].name;
        pill.onclick=()=>{if(confirm("삭제할까요?"))teamsRef.child(key+"/members/"+id).remove();};
        list.appendChild(pill);
      });
    });
  }
  teamsRef.on("value",s=>renderTeams(s.val()||{}));
  document.querySelectorAll(".team-name").forEach(i=>{
    i.onchange=()=>teamsRef.child(i.dataset.team).update({name:i.value});
  });
  document.querySelectorAll(".team-add-btn").forEach(b=>{
    b.onclick=()=>{
      const name=prompt("팀원 이름:");
      if(!name)return;
      teamsRef.child(b.dataset.team+"/members").push({name:name,addedBy:nickname});
    };
  });

  /* ===== 접속자 표시 ===== */
  const presenceRef=db.ref("presence");
  const connectedRef=db.ref(".info/connected");
  const myRef=presenceRef.push();
  connectedRef.on("value",snap=>{
    if(snap.val()===true){
      myRef.onDisconnect().remove();
      myRef.set({nick:nickname,time:Date.now()});
    }
  });
  const list=document.getElementById("online-list");
  const count=document.getElementById("online-count");
  presenceRef.on("value",s=>{
    const arr=[];
